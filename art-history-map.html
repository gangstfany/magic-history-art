      function renderActiveArtworkImage(mediaIndex) {
        const viewRenderGeneration = ++mediaViewRenderGeneration;
        activeMediaIndex = mediaIndex;
        const publicMedia = mediaItems[activeMediaIndex];
        const mediaIdentity = `${work.id}::${publicMedia.id}`;
        const media = resolveMediaView(work, publicMedia);
        const credit = media.privateCredit ?? credits[activeMediaIndex];
        if (media.mediaStatus === 'rightsRestricted' || !media.imageUrl) {
          imageStage.replaceChildren(createRightsPlaceholder(work, media, PRIVATE_MEDIA_MODE));
          creditHost.replaceChildren();
          viewButtons.forEach((button, index) => {
            button.setAttribute('aria-pressed', String(index === activeMediaIndex));
          });
          return;
        }
        const image = document.createElement('img');
        image.src = media.imageUrl;
        image.alt = media.imageAlt;
        let privateFailureHandled = false;
        const handlePrivateMediaFailure = media.mediaStatus === 'privateLocal'
          ? () => {
              const currentPublicMedia = mediaItems[activeMediaIndex];
              if (
                privateFailureHandled
                || artworkRenderGeneration !== artworkMediaRenderGeneration
                || viewRenderGeneration !== mediaViewRenderGeneration
                || activeMediaIndex !== mediaIndex
                || `${work.id}::${currentPublicMedia?.id}` !== mediaIdentity
              ) return;
              privateFailureHandled = true;
              const placeholder = createRightsPlaceholder(work, publicMedia, true);
              imageStage.replaceChildren(placeholder);
              creditHost.replaceChildren();
              viewButtons.forEach((button, index) => {
                button.setAttribute('aria-pressed', String(index === activeMediaIndex));
              });
              if (imageDialog.open && imageDialogTrigger === imageButton) {
                imageDialogTrigger = null;
                imageDialog.close();
                document.getElementById('dialogMedia').replaceChildren();
              }
              placeholder.focus();
            }
          : null;
        installImageFallback(image, work, null, handlePrivateMediaFailure);
        imageButton.replaceChildren(image);
        imageStage.replaceChildren(imageButton);
        imageButton.setAttribute(
          'aria-label',
          `Open ${work.titleEn}（${work.titleZh}）· ${media.label} 大图`
        );
        imageButton.onclick = () => openImageDialog(
          work,
          media,
          credit,
          imageButton,
          handlePrivateMediaFailure
        );
        creditHost.replaceChildren(createImageCredit(media, credit));
        viewButtons.forEach((button, index) => {
          button.setAttribute('aria-pressed', String(index === activeMediaIndex));
        });
      }

      let imageViewSwitcher = null;
      if (mediaItems.length > 1) {
        imageViewSwitcher = document.createElement('div');
        imageViewSwitcher.className = 'image-view-switcher';
        imageViewSwitcher.setAttribute('role', 'group');
        imageViewSwitcher.setAttribute('aria-label', 'Choose artwork image view');
        viewButtons = mediaItems.map((media, mediaIndex) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = media.label;
          button.setAttribute('aria-pressed', 'false');
          button.addEventListener('click', () => renderActiveArtworkImage(mediaIndex));
          imageViewSwitcher.append(button);
          return button;
        });
      }
      renderActiveArtworkImage(0);

      const identity = document.createElement('dl');
      identity.className = 'identity-list';
      const siteQualifier = work.provenanceQualifier ?? work.siteQualifier;
      [
        ['年代', work.date],
        ['艺术家／文化', work.artistCulture],
        ['材料', work.medium],
        ['地点', `${work.siteName}${siteQualifier ? ` · ${siteQualifier}` : ''}`],
        ['类型', work.workType],
        ['功能', work.function]
      ].forEach(([label, value]) => {
        const row = document.createElement('div');
        row.className = 'identity-row';
        const term = document.createElement('dt');
        term.textContent = label;
        const description = document.createElement('dd');
        description.textContent = value;
        row.append(term, description);
        identity.append(row);
      });
      summary.append(heading, chineseTitle, meta, imageStage);
      if (imageViewSwitcher) summary.append(imageViewSwitcher);
      summary.append(creditHost, identity);

      if (group.works.length > 1) {
        const cycle = document.createElement('div');
        cycle.className = 'site-cycle';
        const previous = document.createElement('button');
        previous.type = 'button';
        previous.setAttribute('aria-label', '上一件同地点作品');
        previous.textContent = '←';
        previous.addEventListener('click', () => cycleSite(group, -1));
        const position = document.createElement('span');
        position.textContent = `${state.selectedSiteIndex + 1} / ${group.works.length}`;
        const next = document.createElement('button');
        next.type = 'button';
        next.setAttribute('aria-label', '下一件同地点作品');
        next.textContent = '→';
        next.addEventListener('click', () => cycleSite(group, 1));
        cycle.append(previous, position, next);
        summary.append(cycle);
      }

      const tabs = [
        { id:'quick', label:'速览' },
        { id:'form', label:'形式' },
        { id:'context', label:'语境' },
        { id:'compare', label:'比较' }
      ];
      const tablist = document.createElement('div');
      tablist.className = 'detail-tabs';
      tablist.setAttribute('role', 'tablist');
      tablist.setAttribute('aria-label', '作品学习视角');
      const panel = document.createElement('section');
      panel.id = 'detail-tabpanel';
      panel.className = 'detail-tabpanel';
      panel.setAttribute('role', 'tabpanel');
      panel.tabIndex = 0;

      function activateTab(tabId, focus = false) {
        state.activeDetailTab = tabId;
        tablist.querySelectorAll('[role="tab"]').forEach((button) => {
          const active = button.dataset.tab === tabId;
          button.setAttribute('aria-selected', String(active));
          button.tabIndex = active ? 0 : -1;
          if (active) panel.setAttribute('aria-labelledby', button.id);
        });
        panel.replaceChildren();
        if (tabId === 'quick') {
          panel.append(createStudyBlock('核心功能', work.function));
          const anchors = createStudyBlock('识别锚点');
          const list = document.createElement('ul');
          list.className = 'anchor-list';
          work.recognitionAnchors.forEach((anchor) => {
            const item = document.createElement('li');
            item.textContent = anchor;
            list.append(item);
          });
          anchors.append(list);
          panel.append(anchors);
        } else if (tabId === 'form') {
          panel.append(createStudyBlock('形式', work.form), createStudyBlock('内容', work.content));
        } else if (tabId === 'context') {
          panel.append(createStudyBlock('历史语境', work.context), createStudyBlock('图像内容', work.content));
        } else {
          const grid = document.createElement('div');
          grid.className = 'comparison-grid';
          work.comparisonIds.forEach((comparisonId) => {
            const comparison = ARTWORKS.find((item) => item.id === comparisonId);
            if (!comparison) return;
            const card = document.createElement('article');
            card.className = 'comparison-card comparison-preview';
            card.dataset.comparisonId = comparison.id;
            const title = document.createElement('strong');
            title.textContent = `${comparison.titleZh} · ${comparison.titleEn}`;
            const details = document.createElement('span');
            details.textContent = `AP #${comparison.apNumber} · ${comparison.period}`;
            const angle = document.createElement('span');
            angle.className = 'comparison-angle';
            angle.textContent = work.comparisonNotes?.[comparison.id]?.trim()
              ? work.comparisonNotes[comparison.id] : createComparisonAngle(work, comparison);
            card.append(title, details, angle);
            {
              const bilingual = angle.textContent.match(/^([\s\S]*?。)\s+([A-Z][\s\S]*)$/);
              if (bilingual) {
                angle.textContent = bilingual[1];
                const english = document.createElement('details');
                english.className = 'comparison-note-english';
                const label = document.createElement('summary');
                label.textContent = 'English';
                const copy = document.createElement('p');
                copy.textContent = bilingual[2];
                english.append(label, copy);
                card.append(english);
              }
              const start = document.createElement('button');
              start.type = 'button';
              start.className = 'comparison-start';
              start.dataset.compareSource = work.id;
              start.dataset.compareTarget = comparison.id;
              start.textContent = '开始对比 ↗';
              start.setAttribute('aria-label', `开始对比：${work.titleZh}与${comparison.titleZh}`);
              card.append(start);
            }
            grid.append(card);
          });
          panel.append(grid.children.length ? grid : createStudyBlock('暂无比较作品', '此作品暂未关联比较对象。'));
        }
        if (focus) tablist.querySelector(`[data-tab="${tabId}"]`)?.focus();
      }

      tabs.forEach(({ id, label }, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.id = `detail-tab-${id}`;
        button.className = 'detail-tab';
        button.dataset.tab = id;
        button.setAttribute('role', 'tab');
        button.setAttribute('aria-controls', 'detail-tabpanel');
        button.textContent = label;
        button.addEventListener('click', () => activateTab(id));
        button.addEventListener('keydown', (event) => {
          const current = tabs.findIndex((tab) => tab.id === state.activeDetailTab);
          let next = current;
          if (event.key === 'ArrowRight') next = (current + 1) % tabs.length;
          else if (event.key === 'ArrowLeft') next = (current - 1 + tabs.length) % tabs.length;
          else if (event.key === 'Home') next = 0;
          else if (event.key === 'End') next = tabs.length - 1;
          else return;
          event.preventDefault();
          activateTab(tabs[next].id, true);
        });
        tablist.append(button);
      });
      summary.append(tablist, panel);
      activateTab(tabs.some((tab) => tab.id === state.activeDetailTab) ? state.activeDetailTab : 'quick');
      return summary;
    }

    function renderExpandedWorkPins(
      group,
      center,
      screenScale,
      obstacleBounds,
      visibleBounds
    ) {
      const leaders = [];
      const pins = [];
      const metrics = getExpandedPinMetrics(screenScale);
      expandedPinPositions(
        group,
        center,
        screenScale,
        obstacleBounds,
        visibleBounds
      ).forEach(({ work, x, y }) => {
        const leader = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        leader.classList.add('expanded-pin-leader');
        leader.setAttribute('x1', String(center.x));
        leader.setAttribute('y1', String(center.y));
        leader.setAttribute('x2', String(x));
        leader.setAttribute('y2', String(y));
        leader.setAttribute('vector-effect', 'non-scaling-stroke');
        leaders.push(leader);

        const pin = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        pin.classList.add('expanded-work-pin');
        pin.dataset.workId = work.id;
        pin.dataset.siteToken = group.siteToken;
        pin.setAttribute('transform', `translate(${x} ${y})`);
        pin.setAttribute('role', 'button');
        pin.setAttribute('tabindex', '0');
        pin.setAttribute('aria-pressed', String(state.selectedId === work.id));
        pin.setAttribute(
          'aria-label',
          `AP ${work.apNumber} · ${work.titleEn} · ${group.siteName}`
        );
        if (state.selectedId === work.id) pin.classList.add('is-active');
        pin.addEventListener('click', () => selectArtwork(work.id, group.siteToken));
        pin.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          selectArtwork(work.id, group.siteToken, true);
        });

        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        title.textContent = `AP ${work.apNumber} · ${work.titleEn} · ${group.siteName}`;
        const hitArea = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        hitArea.classList.add('expanded-pin-hit-area');
        hitArea.setAttribute('r', String(metrics.hitWidth / 2));
        const visual = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        visual.classList.add('expanded-pin-visual');
        const background = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        background.classList.add('expanded-pin-bg');
        background.setAttribute('r', String(metrics.visualDiameter / 2));
        background.setAttribute('vector-effect', 'non-scaling-stroke');
        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.classList.add('expanded-pin-label');
        label.setAttribute('font-size', String(metrics.fontSize));
        label.style.fontSize = `${metrics.fontSize}px`;
        label.textContent = String(work.apNumber);
        visual.append(background, label);
        pin.append(title, hitArea, visual);
        pins.push(pin);
      });
      return { leaders, pins };
    }

    function render() {
      const mapBounds = document.querySelector('.map-svg')?.getBoundingClientRect?.();
      // A hidden subject iframe has no layout. Keep its state and existing
      // markers; the ResizeObserver redraws them when the subject is shown.
      if (mapBounds && (mapBounds.width <= 0 || mapBounds.height <= 0)) return;
      document.dispatchEvent?.(new Event('art-before-render'));
      artworkMediaRenderGeneration += 1;
      const focusedSiteToken = document.activeElement?.classList?.contains('site-marker')
        ? document.activeElement.dataset.siteToken
        : null;
      const focusedWorkId = document.activeElement?.dataset?.workId || null;
      const focusedDetailImageButton = document.activeElement?.classList?.contains('artwork-image-button');
      const focusedDetailHeading = document.activeElement?.hasAttribute?.('data-selected-artwork-title');
      const focusedDetailTab = document.activeElement?.classList?.contains('detail-tab')
        ? document.activeElement.id : null;
      const visibleWorks = filterWorks(ARTWORKS, state);
      renderRegionColors(visibleWorks, state);
      const mappableWorks = visibleWorks.filter((work) => !isUnmappedWork(work));
      if (state.selectedId && !visibleWorks.some((work) => work.id === state.selectedId)) {
        state.selectedId = null;
        state.selectedSiteIndex = 0;
      }
      const leaders = [];
      const markers = [];
      const renderedMarkerScale = getRenderedMarkerScale();
      const visibleGroups = layoutMapGroups(
        visibleWorks,
        state.transform.scale,
        renderedMarkerScale,
        {
          selectedUnit:state.unit,
          activeUnit:state.activeUnit,
          activeRegion:state.activeRegion
        },
        getVisibleWorldBounds(state.transform),
        // Every Unit may need the visible letterboxing for region navigation.
        // Reserving this for Units 9–10 could abort render and retain stale pins.
        getDensePackingBounds(state.transform, mapBounds)
      );
      if (
        state.expandedSiteToken
        && !visibleGroups.some((group) => (
          group.siteToken === state.expandedSiteToken && group.works.length > 1
        ))
      ) {
        state.expandedSiteToken = null;
      }
      visibleGroups.forEach((group) => {
        if (Math.hypot(group.displayX - group.anchorX, group.displayY - group.anchorY) > 1) {
          const leader = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          leader.classList.add('marker-leader');
          leader.setAttribute('x1', group.anchorX);
          leader.setAttribute('y1', group.anchorY);
          leader.setAttribute('x2', group.displayX);
          leader.setAttribute('y2', group.displayY);
          leaders.push(leader);
        }
        const marker = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        marker.classList.add('site-marker');
        marker.dataset.siteToken = group.siteToken;
        marker.dataset.groupKind = group.kind;
        marker.setAttribute('transform', `translate(${group.displayX} ${group.displayY})`);
        marker.setAttribute('role', 'button');
        marker.setAttribute('tabindex', '0');
        marker.setAttribute('aria-pressed', String(group.works.some((work) => work.id === state.selectedId)));
        if (group.kind === 'site' && group.works.length > 1) {
          marker.setAttribute('aria-expanded', String(state.expandedSiteToken === group.siteToken));
        }
        if (
          group.works.some((work) => work.id === state.selectedId)
          || state.expandedSiteToken === group.siteToken
        ) marker.classList.add('is-active');
        const groupText = group.markerText || getMapGroupText(group);
        marker.setAttribute('aria-label', `${groupText.title} · ${groupText.subtitle}`);
        marker.addEventListener('click', () => expandSiteGroup(group));
        marker.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          expandSiteGroup(group, true);
        });
        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        title.textContent = `${groupText.title} · ${groupText.subtitle}`;
        const metrics = group.markerMetrics;
        const hitArea = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        hitArea.classList.add('marker-hit-area');
        hitArea.setAttribute('x', String(-metrics.hitWidth / 2));
        hitArea.setAttribute('y', String(-metrics.hitHeight / 2));
        hitArea.setAttribute('width', String(metrics.hitWidth));
        hitArea.setAttribute('height', String(metrics.hitHeight));
        hitArea.setAttribute('rx', String(metrics.hitHeight / 2));
        const visual = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        visual.classList.add('marker-visual');
        const background = document.createElementNS(
          'http://www.w3.org/2000/svg',
          isSingleWorkSiteGroup(group) ? 'circle' : 'rect'
        );
        background.classList.add('marker-label-bg');
        if (isSingleWorkSiteGroup(group)) {
          background.setAttribute('r', String(metrics.visualWidth / 2));
        } else {
          background.setAttribute('x', String(-metrics.visualWidth / 2));
          background.setAttribute('y', String(-metrics.visualHeight / 2));
          background.setAttribute('width', String(metrics.visualWidth));
          background.setAttribute('height', String(metrics.visualHeight));
          background.setAttribute('rx', String(metrics.cornerRadius));
        }
        if (isSingleWorkSiteGroup(group) || group.isGridFallback) {
          const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          label.classList.add('marker-ap-label');
          label.setAttribute('font-size', String(metrics.fontSize));
          label.style.fontSize = `${metrics.fontSize}px`;
          label.textContent = group.apLabel;
          visual.append(background, label);
        } else if (group.isDenseFallback) {
          visual.append(background);
          const words = groupText.title.split(/\s+/);
          let titleLines = [groupText.title];
          if (words.length > 1) {
            titleLines = Array.from({ length: words.length - 1 }, (_, index) => {
              const split = index + 1;
              return [words.slice(0, split).join(' '), words.slice(split).join(' ')];
            }).sort((first, second) => (
              Math.max(...first.map((line) => line.length))
              - Math.max(...second.map((line) => line.length))
            ))[0];
          }
          titleLines.forEach((titleLine, index) => {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            line.classList.add('marker-title-label');
            line.setAttribute('font-size', String(metrics.titleFontSize));
            line.style.fontSize = `${metrics.titleFontSize}px`;
            line.setAttribute(
              'y',
              String((titleLines.length === 1 ? -5 : -12 + index * 11)
                / Math.max(0.05, renderedMarkerScale))
            );
            line.textContent = titleLine;
            visual.append(line);
          });
          const subtitleLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          subtitleLabel.classList.add('marker-subtitle-label');
          subtitleLabel.setAttribute('font-size', String(metrics.subtitleFontSize));
          subtitleLabel.style.fontSize = `${metrics.subtitleFontSize}px`;
          subtitleLabel.setAttribute(
            'y',
            String(15 / Math.max(0.05, renderedMarkerScale))
          );
          subtitleLabel.textContent = groupText.subtitle;
          visual.append(subtitleLabel);
        } else {
          const titleLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          titleLabel.classList.add('marker-title-label');
          titleLabel.setAttribute('font-size', String(metrics.titleFontSize));
          titleLabel.style.fontSize = `${metrics.titleFontSize}px`;
          titleLabel.setAttribute('y', String(-6 / Math.max(0.05, renderedMarkerScale)));
          titleLabel.textContent = groupText.title;
          const subtitleLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          subtitleLabel.classList.add('marker-subtitle-label');
          subtitleLabel.setAttribute('font-size', String(metrics.subtitleFontSize));
          subtitleLabel.style.fontSize = `${metrics.subtitleFontSize}px`;
          subtitleLabel.setAttribute('y', String(7 / Math.max(0.05, renderedMarkerScale)));
          subtitleLabel.textContent = groupText.subtitle;
          visual.append(background, titleLabel, subtitleLabel);
        }
        marker.append(title, hitArea, visual);
        markers.push(marker);
      });
      const expandedGroup = visibleGroups.find((group) => (
        group.works.length > 1 && group.siteToken === state.expandedSiteToken
      ));
      expandedPinList.hidden = true;
      expandedPinList.classList.remove('is-visible');
      mapPanel.classList.remove('has-compact-list');
      expandedPinList.replaceChildren();
      if (expandedGroup) {
        const expandedCenter = { x: expandedGroup.displayX, y: expandedGroup.displayY };
        const obstacleBounds = visibleGroups.map((group) => group.bounds);
        const visibleWorldBounds = getVisibleWorldBounds(state.transform);
        if (shouldUseCompactExpandedList(
          expandedGroup,
          expandedCenter,
          renderedMarkerScale,
          obstacleBounds,
          visibleWorldBounds
        )) {
          renderCompactExpandedList(expandedGroup);
        } else {
          const expanded = renderExpandedWorkPins(
            expandedGroup,
            expandedCenter,
            renderedMarkerScale,
            obstacleBounds,
            visibleWorldBounds
          );
          leaders.push(...expanded.leaders);
          markers.push(...expanded.pins);
        }
      }
      markerLayer.replaceChildren(...leaders, ...markers);
      if (state.pendingFocusParentKey) {
        focusHierarchyChild(state.pendingFocusParentKey, visibleGroups);
        state.pendingFocusParentKey = null;
      } else if (focusedWorkId) focusExpandedWorkPin(focusedWorkId);
      else if (focusedSiteToken) focusSiteMarker(focusedSiteToken);

      detailPanel.replaceChildren();
      const count = document.createElement('p');
      count.className = 'result-count';
      count.textContent = `当前显示 ${visibleWorks.length} 件作品`;
      detailPanel.append(count);
      const unmappedWorks = visibleWorks.filter(isUnmappedWork);
      if (unmappedWorks.length) {
        const section = document.createElement('section');
        section.className = 'instruction-card study-block';
        const heading = document.createElement('h3');
        heading.textContent = `Location not verified · ${formatPieceCount(unmappedWorks.length)}`;
        section.append(heading);
        const buttonList = document.createElement('div');
        buttonList.className = 'comparison-grid';
        unmappedWorks.forEach((work) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'expanded-pin-list-button';
          button.dataset.unmappedWorkId = work.id;
          button.setAttribute('aria-label', `AP ${work.apNumber} · ${work.titleEn}`);
          button.setAttribute('aria-pressed', String(state.selectedId === work.id));
          const badge = document.createElement('span');
          badge.className = 'art-bubble-number';
          badge.textContent = String(work.apNumber);
          badge.setAttribute('aria-hidden', 'true');
          const copy = document.createElement('span');
          copy.className = 'art-bubble-copy';
          const title = document.createElement('span');
          title.className = 'art-bubble-title';
          title.textContent = work.titleEn;
          const meta = document.createElement('span');
          meta.className = 'art-bubble-meta';
          meta.textContent = `${work.titleZh} · 查看作品 →`;
          copy.append(title, meta);
          button.append(badge, copy);
          button.addEventListener('click', () => selectComparison(work.id));
          buttonList.append(button);
        });
        section.append(buttonList);
        detailPanel.append(section);
      }
      if (!visibleWorks.length) {
        const empty = document.createElement('section');
        empty.className = 'empty-state';
        const heading = document.createElement('h2');
        heading.textContent = '没有找到匹配作品';
        const copy = document.createElement('p');
        copy.textContent = '试试更换文化、时期、类型，或使用其他关键词。';
        const clear = document.createElement('button');
        clear.type = 'button';
        clear.className = 'clear-button';
        clear.textContent = '清除筛选';
        clear.addEventListener('click', clearFilters);
        empty.append(heading, copy, clear);
        detailPanel.append(empty);
      } else if (state.selectedId) {
        const selected = visibleWorks.find((work) => work.id === state.selectedId);
        const selectedGroup = groupBySite(visibleWorks)
          .find((group) => group.works.some((work) => work.id === state.selectedId));
        state.selectedSiteIndex = Math.max(0, selectedGroup.works.findIndex((work) => work.id === state.selectedId));
        detailPanel.append(renderArtworkDetails(selected, selectedGroup));
      } else {
        const instruction = document.createElement('section');
        instruction.className = 'instruction';
        instruction.setAttribute('aria-label', '地图使用说明');
        const heading = document.createElement('h2');
        heading.textContent = 'Explore the Units 1-10 map hierarchy';
        const copy = document.createElement('p');
        copy.textContent = 'Explore all 250 AP works across Units 1-10. Select a Unit, then a region, then a site. Single-work sites are AP-number pins; multi-work sites expand to individual works.';
        const legend = document.createElement('div');
        legend.className = 'legend';
        legend.textContent = 'Unit → region → site → AP work';
        instruction.append(heading, copy, legend);
        detailPanel.append(instruction);
      }
      // Host height updates resize the iframe and redraw this panel. Keep the
      // reader's logical focus rather than dropping it onto the document body.
      if (focusedDetailHeading) detailPanel.querySelector('[data-selected-artwork-title]')?.focus({ preventScroll:true });
      else if (focusedDetailTab) document.getElementById(focusedDetailTab)?.focus({ preventScroll:true });
      else if (focusedDetailImageButton) detailPanel.querySelector('.artwork-image-button')?.focus({ preventScroll:true });
    }

    function clearFilters() {
      cancelFilteredFocus();
      Object.assign(state, {
        unit:'all',
        culture:'all',
        period:'',
        workType:'',
        studyCategory:'',
        studyCategoryAps:null,
        search:'',
        selectedId:null,
        selectedSiteIndex:0,
        expandedSiteToken:null,
        activeUnit:null,
        activeRegion:null,
        pendingFocusParentKey:null,
        activeDetailTab:'quick',
        transform:{ x:0, y:0, scale:1 }
      });
      syncFilterControls();
      render();
      applyTransform();
    }

    function clearHierarchyBranch() {
      state.activeUnit = null;
      state.activeRegion = null;
      state.pendingFocusParentKey = null;
      state.expandedSiteToken = null;
    }

    function syncHierarchyBranchForZoom() {
      if (state.transform.scale < 2.5) state.activeRegion = null;
      if (state.transform.scale < 1.5) {
        state.activeUnit = null;
        state.activeRegion = null;
      }
      state.pendingFocusParentKey = null;
    }

    function selectUnit(unit) {
      cancelFilteredFocus();
      Object.assign(state, {
        unit,
        culture:'all',
        period:'',
        workType:'',
        studyCategory:'',
        studyCategoryAps:null,
        search:'',
        selectedId:null,
        selectedSiteIndex:0,
        expandedSiteToken:null,
        activeUnit:unit === 'all' ? null : Number(unit),
        activeRegion:null,
        pendingFocusParentKey:null,
        activeDetailTab:'quick',
        transform:{ x:0, y:0, scale:1 }
      });
      syncFilterControls();
      if (unit !== 'all') fitMapToWorks(getWorksForUnit(unit));
      applyTransform();
      scheduleMarkerLayout();
    }

    populateUnitOptions();
    syncFilterControls();
    document.getElementById('unitFilter').addEventListener('change', (event) => {
      selectUnit(event.target.value);
    });
    document.getElementById('periodFilter').addEventListener('change', (event) => {
      clearHierarchyBranch();
      state.period = event.target.value;
      fitCurrentWorks();
    });
    document.getElementById('typeFilter').addEventListener('change', (event) => {
      clearHierarchyBranch();
      state.workType = event.target.value;
      fitCurrentWorks();
    });
    document.getElementById('searchInput').addEventListener('input', (event) => {
      clearHierarchyBranch();
      state.search = event.target.value;
      render();
      cancelFilteredFocus();
      filteredFocusTimer = setTimeout(fitCurrentWorks, 180);
    });
    document.getElementById('zoomIn').addEventListener('click', () => {
      cancelFilteredFocus();
      state.transform = zoomAroundPoint(state.transform, state.transform.scale + .5);
      render();
      applyTransform();
    });
    document.getElementById('zoomOut').addEventListener('click', () => {
      cancelFilteredFocus();
      state.transform = zoomAroundPoint(state.transform, state.transform.scale - .5);
      syncHierarchyBranchForZoom();
      render();
      applyTransform();
    });
    document.getElementById('resetView').addEventListener('click', () => {
      cancelFilteredFocus();
      clearHierarchyBranch();
      state.transform = { x:0, y:0, scale:1 };
      render();
      applyTransform();
    });
    window.addEventListener('resize', scheduleMarkerLayout);
    const markerResizeObserver = new ResizeObserver(scheduleMarkerLayout);
    markerResizeObserver.observe(mapPanel);

    const panSurface = document.getElementById('panSurface');
    let panStart = null;
    panSurface.addEventListener('pointerdown', (event) => {
      cancelFilteredFocus();
      if (event.button !== 0) return;
      if (event.cancelable) event.preventDefault();
      panSurface.setPointerCapture(event.pointerId);
      panStart = {
        pointerId: event.pointerId,
        clientX: event.clientX,
        clientY: event.clientY,
        x: state.transform.x,
        y: state.transform.y
      };
    });
    panSurface.addEventListener('pointermove', (event) => {
      if (!panStart || event.pointerId !== panStart.pointerId) return;
      if (event.cancelable) event.preventDefault();
      const bounds = document.querySelector('.map-svg').getBoundingClientRect();
      const delta = clientDeltaToViewBox(
        event.clientX - panStart.clientX,
        event.clientY - panStart.clientY,
        bounds.width,
        bounds.height
      );
      state.transform = clampTransform({
        ...state.transform,
        x: panStart.x + delta.x,
        y: panStart.y + delta.y
      });
      applyTransform();
    });
    const stopPan = (event) => {
      if (!panStart || event.pointerId !== panStart.pointerId) return;
      panStart = null;
      if (panSurface.hasPointerCapture(event.pointerId)) panSurface.releasePointerCapture(event.pointerId);
    };
    panSurface.addEventListener('pointerup', stopPan);
    panSurface.addEventListener('pointercancel', stopPan);
    panSurface.addEventListener('lostpointercapture', stopPan);

    document.getElementById('dialogClose').addEventListener('click', () => imageDialog.close());
    imageDialog.addEventListener('click', (event) => {
      if (event.target === imageDialog) imageDialog.close();
    });
    imageDialog.addEventListener('close', () => {
      clearImageDialogViewport?.();
      clearImageDialogViewport = null;
      for (const property of ['position', 'overflow', 'top', 'bottom', 'margin-top', 'margin-bottom', 'max-height']) {
        imageDialog.style?.removeProperty(property);
      }
      const focusTarget = imageDialogTrigger?.isConnected
        ? imageDialogTrigger
        : detailPanel.querySelector('.artwork-image-button');
      focusTarget?.focus();
      imageDialogTrigger = null;
    });

    window.ArtHistoryMap = {
      normalize,
      filterWorks,
      getRegionColorScope,
      compactApNumbers,
      formatApGroupLabel,
      formatPieceCount,
      createSiteToken,
      getUnitById,
      getMapGroupText,
      groupBySite,
      groupByConfiguredRegion,
      toWorldCoordinates,
      getMapScreenScale,
      isSingleWorkSiteGroup,
      getMarkerMetrics,
      getMarkerBounds,
      markerBoundsOverlap,
      expandMarkerBounds,
      createSpatialHash,
      findNearestAvailableMarkerSlot,
      layoutSiteMarkers,
      clampTransform,
      cycleIndex,
      zoomAroundPoint,
      clientDeltaToViewBox,
      validatePrivateMediaOverrides,
      loadPrivateMediaOverrides,
      resolveMediaView,
      installImageFallback,
      createImageCredit,
      createRightsPlaceholder,
      createComparisonAngle,
      getArtworkImages,
      getArtworkImageCredits,
      openImageDialog,
      selectComparison,
      selectArtwork,
      expandSiteGroup,
      focusSelectedArtworkHeading,
      applyTransform,
      fitCurrentWorks,
      filterWorks,
      render,
      clearFilters,
      state,
      ARTWORKS
    };
    loadPrivateMediaOverrides().then((overrides) => {
      privateMediaOverrides = overrides;
      runDevelopmentAssertions();
      render();
      applyTransform();
      assertRenderedMarkerSemantics();
    });
  </script>
  <script type="module" src="art-comparison.mjs"></script>
  <script type="module" src="art-category-filters.mjs"></script>
  <script type="module" src="art-study-panel.mjs"></script>
  <script type="module" src="module-bridge.mjs"></script>
</body>
</html>
