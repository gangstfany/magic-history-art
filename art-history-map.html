<html lang="zh-CN">
<head>

  <title>AP 艺术史互动地图 · Units 1-10</title>
  <style>
    :root {
      color-scheme:light;
      --ink:#211f1c;
      --ink-soft:#6b6558;
      --ink-faint:#9b9382;
      --paper:#f9f4e8;
      --card:#fffdf8;
      --surface-sunken:#f2e9d8;
      --line:#e7dcc6;
      --line-strong:#d8c9a8;
      --accent:#8b1a1a;
      --map-blue:#597f8b;
      --unit-marker:#8b1a1a;
    }
    * { box-sizing: border-box; }
    html, body {
      font-family:"PingFang SC", "Hiragino Sans GB", -apple-system, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    body { margin:0; min-width:0; color:var(--ink); background:var(--paper); }
    .page-header { max-width:1180px; margin:auto; padding:28px 20px 14px; }
    .page-header h1 { margin:0 0 6px; font-size:19px; font-weight:800; letter-spacing:-.01em; }
    .subtitle { margin:0; color:var(--ink-soft); font-size:12px; line-height:1.6; }
    .filter-toolbar { max-width:1180px; margin:0 auto 16px; padding:0 20px; display:flex; flex-wrap:wrap; gap:8px; align-items:end; }
    .culture-filters { display:flex; flex-wrap:wrap; gap:6px; flex-basis:100%; width:100%; }
    .culture-filters[hidden] { display:none; }
    .filter-label { display:grid; gap:3px; color:var(--ink-soft); font-size:12px; font-weight:600; }
    button, select, input { font:inherit; }
    .filter-pill, .clear-button { min-height:34px; border:1px solid var(--line); border-radius:999px; padding:6px 12px; color:var(--ink); background:var(--card); font-size:13px; font-weight:600; cursor:pointer; }
    .filter-pill[aria-pressed="true"] { color:#fff; background:#4d463e; border-color:#4d463e; }
    select, input[type="search"] { min-height:34px; max-width:100%; border:1px solid var(--line); border-radius:8px; padding:5px 9px; color:var(--ink); background:var(--card); font-size:13px; font-weight:600; }
    #unitFilter { min-height:44px; font-size:13px; font-weight:600; }
    #searchInput { width:min(260px,100%); }
    :focus-visible { outline:3px solid #28708a; outline-offset:3px; }
    .art-workspace { width:calc(100% - 40px); max-width:1180px; height:min(620px,78vh); min-height:480px; margin:0 auto 28px; display:grid; grid-template-columns:minmax(0,2fr) minmax(275px,1fr); overflow:hidden; border:1px solid var(--line); border-radius:18px; background:var(--card); box-shadow:0 14px 36px rgba(74,57,38,.11); }
    .map-panel { position:relative; min-width:0; overflow:hidden; background:#f0e6d6; }
    .map-svg { display:block; width:100%; height:100%; }
    #panSurface { touch-action:none; }
    .world-geography { pointer-events:none; }
    .marker-layer { pointer-events:none; }
    .marker-leader { stroke:#8c7d68; stroke-width:2.5; stroke-linecap:round; opacity:.72; vector-effect:non-scaling-stroke; pointer-events:none; }
    .site-marker { pointer-events:all; cursor:pointer; }
    .site-marker .marker-hit-area { fill:transparent; pointer-events:all; }
    .site-marker .marker-visual { transform-box:fill-box; transform-origin:center; transition:transform .15s ease; pointer-events:none; }
    .site-marker.is-active .marker-visual { transform:scale(1.08); }
    .site-marker .marker-label-bg { fill:var(--map-blue); stroke:#fff; stroke-width:2; filter:drop-shadow(0 2px 3px rgba(40,30,20,.32)); transition:stroke-width .15s ease,filter .15s ease; }
    .site-marker.is-active .marker-label-bg { stroke-width:3; filter:drop-shadow(0 3px 5px rgba(40,30,20,.45)); }
    .site-marker .marker-ap-label { fill:#fff; font-size:10px; font-weight:700; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
    .site-marker .marker-title-label { fill:#fff; font-size:11px; font-weight:700; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
    .site-marker .marker-subtitle-label { fill:#fff; font-size:10px; font-weight:600; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
    .site-marker[data-group-kind="unit"] .marker-label-bg { fill:var(--unit-marker); }
    .expanded-pin-leader { stroke:#665b4c; stroke-width:2; stroke-linecap:round; opacity:.78; vector-effect:non-scaling-stroke; pointer-events:none; }
    .expanded-work-pin { pointer-events:all; cursor:pointer; }
    .expanded-work-pin .expanded-pin-hit-area { fill:transparent; pointer-events:all; }
    .expanded-work-pin .expanded-pin-visual { transform-box:fill-box; transform-origin:center; transition:transform .15s ease; pointer-events:none; }
    .expanded-work-pin .expanded-pin-bg { fill:var(--map-blue); stroke:#fff; stroke-width:2; filter:drop-shadow(0 2px 3px rgba(40,30,20,.32)); vector-effect:non-scaling-stroke; }
    .expanded-work-pin .expanded-pin-label { fill:#fff; font-size:10px; font-weight:700; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
    .expanded-work-pin.is-active .expanded-pin-visual { transform:scale(1.12); }
    .expanded-work-pin.is-active .expanded-pin-bg { stroke:var(--ink); stroke-width:3; }
    .expanded-pin-list { display:none; width:100%; }
    .expanded-pin-list.is-visible { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:8px; padding:10px; border-top:1px solid var(--line); background:#fffaf2; }
    .map-panel.has-compact-list { display:grid; grid-template-rows:minmax(260px,1fr) auto; overflow:auto; }
    .map-panel.has-compact-list .map-svg { grid-row:1; min-height:260px; }
    .expanded-pin-list-button { display:flex; align-items:center; gap:10px; width:100%; min-height:44px; padding:12px; border:1px solid #dedbd1; border-radius:11px; color:var(--ink); background:var(--paper); font:inherit; text-align:left; overflow-wrap:anywhere; cursor:pointer; }
    .expanded-pin-list-button:hover { border-color:var(--ink-soft); background:#faf5ea; }
    .art-bubble-number { display:grid; place-items:center; flex:0 0 32px; height:32px; border-radius:50%; color:#fff; background:#426b93; font-size:11px; font-weight:700; }
    .art-bubble-copy { display:grid; gap:4px; min-width:0; }
    .art-bubble-title { font-size:13px; font-weight:700; line-height:1.35; overflow-wrap:anywhere; }
    .art-bubble-meta { font-size:11.5px; font-weight:500; color:var(--ink-soft); line-height:1.5; }
    .expanded-pin-list-button.is-active, .expanded-pin-list-button[aria-pressed="true"] { border-color:#597f8b; background:#edf4f4; }
    .map-controls { position:absolute; z-index:2; top:12px; right:12px; display:flex; flex-direction:column; gap:6px; }
    .map-controls button { width:30px; height:30px; min-width:30px; min-height:30px; padding:0; border:1.5px solid #ccc; border-radius:6px; color:#333; background:#fff; font-size:20px; font-weight:700; line-height:1; box-shadow:0 2px 6px rgba(0,0,0,.15); cursor:pointer; }
    .map-controls .overview-button { font-size:11px; }
    .site-cycle button { min-width:40px; min-height:40px; border:1px solid var(--line); border-radius:9px; background:#fffaf0; color:var(--ink); cursor:pointer; }
    .selected-summary { display:grid; gap:8px; }
    .selected-summary h2, .selected-summary p { margin:0; }
    .work-title-en { margin:0; font-size:19px; line-height:1.25; font-weight:800; letter-spacing:-.01em; }
    .work-title-zh { margin:0; font-size:13px; line-height:1.5; font-weight:600; color:var(--ink-soft); }
    .selected-summary .work-meta { color:var(--ink-soft); line-height:1.55; }
    .work-meta { font-size:12px; font-weight:600; }
    .artwork-image-button { display:grid; place-items:center; box-sizing:border-box; width:100%; height:300px; max-height:300px; padding:10px; overflow:hidden; border:1px solid var(--line-strong); border-radius:10px; background:var(--surface-sunken); cursor:zoom-in; }
    .artwork-image-button img { display:block; width:100%; height:278px; max-width:100%; max-height:278px; object-fit:contain; object-position:center; }
    .artwork-media-stage { min-width:0; }
    .rights-placeholder { min-height:270px; margin:0; padding:28px; border:1px solid var(--line); border-radius:16px; background:linear-gradient(145deg,#eee4d5,#faf5ec); display:grid; place-items:center; align-content:center; gap:10px; text-align:center; }
    .rights-placeholder h3, .rights-placeholder p { margin:0; }
    .rights-placeholder p { color:var(--ink-soft); font-weight:600; line-height:1.55; }
    .rights-placeholder-icon { width:52px; height:52px; border-radius:50%; display:grid; place-items:center; background:#fffaf1; color:var(--accent); font-size:24px; }
    .rights-placeholder-source { min-height:44px; padding:0 18px; border:1px solid #aa9b87; border-radius:999px; display:inline-flex; align-items:center; color:var(--accent); font-weight:700; }
    .private-media-missing { color:var(--accent) !important; }
    .image-view-switcher { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 0; }
    .image-view-switcher button { min-height:30px; padding:5px 10px; border:1px solid var(--line); border-radius:999px; background:var(--paper); color:var(--ink-soft); font:inherit; font-size:12px; font-weight:600; cursor:pointer; }
    .image-view-switcher button[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:#fff; }
    .image-fallback { min-height:150px; display:grid; place-items:center; padding:20px; color:var(--ink-soft); background:linear-gradient(135deg,#eadfce,#f8f0e5); text-align:center; }
    .identity-list { display:grid; gap:5px; margin:0; }
    .identity-row { display:grid; grid-template-columns:5.3em minmax(0,1fr); gap:7px; line-height:1.5; }
    .identity-row dt { color:var(--ink-soft); }
    .identity-row dd { margin:0; }
    .detail-tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-top:5px; border-bottom:1px solid var(--line); }
    .detail-tab { min-height:34px; padding:6px 4px; border:0; border-radius:7px 7px 0 0; color:var(--ink-soft); background:transparent; font-size:13px; font-weight:600; cursor:pointer; }
    .detail-tab[aria-selected="true"] { color:var(--ink); background:#eee2cf; font-weight:700; box-shadow:inset 0 -3px #8a5c39; }
    .detail-tabpanel { display:grid; gap:10px; padding:12px 0 2px; line-height:1.55; }
    .detail-tabpanel h3, .detail-tabpanel p, .detail-tabpanel ul { margin:0; }
    .study-block { display:grid; gap:5px; }
    .study-block h3 { font-size:13.5px; font-weight:700; color:#765438; }
    .anchor-list { padding-left:1.25em; }
    .comparison-grid { display:grid; gap:8px; }
    .comparison-card { display:grid; gap:3px; width:100%; padding:11px; border:1px solid var(--line); border-radius:10px; color:var(--ink); background:#fffaf0; text-align:left; cursor:pointer; }
    .comparison-card strong { font-size:.95rem; }
    .comparison-card span { color:var(--ink-soft); font-size:.82rem; }
    .comparison-card .comparison-angle { color:var(--ink); font-size:.84rem; line-height:1.55; }
    .image-credit { color:var(--ink-soft); font-size:.78rem; line-height:1.5; }
    .image-credit a, .dialog-license { color:#765438; }
    .site-cycle { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .detail-panel { min-width:0; overflow:auto; padding:18px; border-left:1px solid var(--line); background:#fffaf2; font-size:13.5px; font-weight:600; line-height:1.55; }
    .result-count { margin:0 0 16px; color:var(--ink-soft); font-size:12px; font-weight:700; }
    .instruction, .empty-state { min-height:200px; display:grid; align-content:center; gap:12px; }
    .instruction h2, .empty-state h2 { margin:0; font-size:19px; }
    .instruction p, .empty-state p { margin:0; color:var(--ink-soft); line-height:1.55; }
    .legend { display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; font-size:12px; }
    #imageDialog { width:min(920px,calc(100% - 28px)); max-height:calc(100vh - 28px); padding:0; border:0; border-radius:16px; color:var(--ink); background:var(--card); box-shadow:0 24px 80px rgba(20,15,10,.45); }
    #imageDialog::backdrop { background:rgba(26,22,18,.78); }
    .dialog-inner { position:relative; display:grid; gap:10px; padding:18px; }
    .dialog-close { position:absolute; z-index:2; top:10px; right:10px; width:44px; height:44px; border:1px solid var(--line); border-radius:50%; color:var(--ink); background:rgba(255,250,240,.95); font-size:1.4rem; cursor:pointer; }
    .dialog-media { min-height:200px; display:grid; place-items:center; overflow:hidden; border-radius:10px; background:#e9dfcf; }
    .dialog-media img { display:block; max-width:100%; max-height:70vh; object-fit:contain; }
    .dialog-copy { display:grid; gap:5px; padding-right:45px; }
    .dialog-copy h2, .dialog-copy p { margin:0; }
    .dialog-copy p { color:var(--ink-soft); line-height:1.5; }
    .dialog-source { color:#765438; }
    body.is-embedded { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
    body.is-embedded .page-header { display:none; }
    body.is-embedded .filter-toolbar { flex:0 0 auto; width:100%; max-width:none; margin:0; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--card); }
    body.is-embedded .art-workspace { flex:1 1 auto; width:100%; max-width:none; height:auto; min-height:0; margin:0; border:0; border-radius:0; box-shadow:none; }

      .image-view-switcher button { min-height:44px; }

      body.is-embedded .filter-toolbar { padding:8px 12px; }

      .filter-toolbar > .filter-label { min-width:0; }
      .filter-toolbar select { min-width:0; }
      .culture-filters { gap:8px; }
      .filter-pill, .clear-button, select, input[type="search"] { min-height:44px; }
      #unitFilter, .culture-filters .filter-pill { min-height:44px; }
      .filter-label:has(#searchInput) { width:100%; }
      #searchInput { width:100%; }
      .map-controls button { width:44px; height:44px; min-width:44px; min-height:44px; }
      body.is-embedded .filter-toolbar { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:end; }
      body.is-embedded .filter-label { min-width:0; width:auto; }
      body.is-embedded select, body.is-embedded #searchInput { width:100%; }
      body.is-embedded .culture-filters { grid-column:1 / -1; }
      body.is-embedded .art-workspace { flex:0 0 auto; min-height:550px; }
      body.is-embedded .map-panel { grid-template-rows:330px auto; }

    @media (max-width:664px) {
      body.is-embedded { height:auto; min-height:100vh; overflow:auto; }

      .map-svg { grid-row:1; min-height:330px; }

    @media (min-width:665px) and (max-height:520px) {
      body.is-embedded { height:100vh; min-height:0; overflow:hidden; }
    }
    @media (max-width:664px) and (min-height:900px) {

    }

    function toWorldCoordinates(workOrGroup) {
      if (
        Number.isFinite(workOrGroup.worldX)
        && Number.isFinite(workOrGroup.worldY)
      ) {
        return { x:workOrGroup.worldX, y:workOrGroup.worldY };
      }
      const projected = SITE_WORLD_COORDINATES[workOrGroup.siteName];
      if (projected) return { ...projected };
      if (workOrGroup.unit === 5) {
        throw new Error(`Missing reviewed Unit 5 map projection: ${workOrGroup.siteName}`);
      }
      const coordinates = workOrGroup.coordinates || workOrGroup;
      const x = Number.isFinite(coordinates.x) ? coordinates.x : 0;
      const y = Number.isFinite(coordinates.y) ? coordinates.y : 0;
      return {
        x: Math.max(0, Math.min(1600, 807 + x * 0.28)),
        y: Math.max(0, Math.min(800, 230 + y * 0.3))
      };
    }

    function normalize(value) {
      return String(value ?? '')
        .normalize('NFKD')
        .replace(/\p{M}/gu, '')
        .replace(/[‘’ʼʻ]/g, "'")
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();
    }

    function filterWorks(works, filters) {
      const query = normalize(filters.search);
      const queryTokens = query.split(' ').filter(Boolean);
      const apNumberMatch = query.match(/^(?:ap\s*#?\s*)?(\d{1,3})$/);
      const apNumberQuery = apNumberMatch && Number(apNumberMatch[1]) <= 250
        ? Number(apNumberMatch[1])
        : null;
      const isApPrefixedQuery = /^ap\s*#?\s*\d{1,3}$/.test(query);
      return works.filter((work) => {
        if (filters.unit && filters.unit !== 'all' && work.unit !== Number(filters.unit)) return false;
        if (
          filters.culture
          && filters.culture !== 'all'
          && (work.traditionGroup ?? work.culture) !== filters.culture
        ) return false;
        if (filters.period && work.period !== filters.period) return false;
        if (filters.workType && work.workType !== filters.workType) return false;
        if (filters.studyCategory && !filters.studyCategoryAps?.includes(work.apNumber)) return false;
        if (!query) return true;
        const region = MAP_REGIONS[work.region];
        const preciseTradition = TRADITION_LABELS[work.culture];
        const broadTradition = TRADITION_LABELS[work.traditionGroup];
        const searchable = [
          work.titleEn,
          work.titleZh,
          String(work.apNumber),
          `AP ${work.apNumber}`,
          work.siteName,
          work.provenanceQualifier,
          work.siteQualifier,
          work.artistCulture,
          work.culture,
          work.traditionGroup,
          work.region,
          region?.nameEn,
          work.period,
          work.date,
          work.medium,
          work.workType,
          broadTradition?.labelEn,
          broadTradition?.labelZh,
          preciseTradition?.labelEn,
          preciseTradition?.labelZh,
          ...(work.keywords || [])
        ]
          .map(normalize).join(' ');
        return (
          work.apNumber === apNumberQuery
          || (!isApPrefixedQuery && (
            searchable.includes(query)
            || queryTokens.every((token) => searchable.includes(token))
          ))
        );
      });
    }

    function getCultureLabel(cultureId, locale = 'zh') {
      const culture = TRADITION_LABELS[cultureId];
      if (!culture) return cultureId;
      return locale === 'en' ? culture.labelEn : culture.labelZh;
    }

    function formatArtworkMeta(work) {
      return `AP #${work.apNumber} · ${getCultureLabel(work.culture, 'zh')} · ${work.period} · ${work.date}`;
    }

    function compactApNumbers(numbers) {
      const sorted = [...new Set(numbers)].sort((a, b) => a - b);
      const ranges = [];
      let start = sorted[0];
      let previous = sorted[0];
      sorted.slice(1).forEach((value) => {
        if (value === previous + 1) {
          previous = value;
          return;
        }
        ranges.push(start === previous ? `${start}` : `${start}–${previous}`);
        start = value;
        previous = value;
      });
      if (start !== undefined) {
        ranges.push(start === previous ? `${start}` : `${start}–${previous}`);
      }
      return ranges.join(', ');
    }

    function formatApGroupLabel(works) {
      return `AP ${compactApNumbers(works.map((work) => work.apNumber))}`;
    }

    function formatPieceCount(count) {
      return `${count} ${count === 1 ? 'piece' : 'pieces'}`;
    }

    function createSiteToken(works) {
      const ids = works.map((work) => String(work.id)).sort().join('__');
      const safeIds = ids.replace(
        /[^a-zA-Z0-9_-]/g,
        (character) => `_${character.codePointAt(0).toString(16)}_`
      );
      return `site-${safeIds}`;
    }

    function getUnitById(unitId) {
      return AP_UNITS.find((unit) => unit.id === unitId) ?? null;
    }

    function getMapGroupText(group) {
      if (group.kind === 'unit') {
        const unit = getUnitById(group.apUnits[0]);
        return {
          title: `U${unit.id}`,
          subtitle: unit.nameEn
        };
      }
      if (group.kind === 'region') {
        return {
          title: MAP_REGIONS[group.regionId]?.nameEn || group.siteName,
          subtitle: formatPieceCount(group.works.length)
        };
      }
      return {
        title: group.siteName,
        subtitle: `${formatApGroupLabel(group.works)} · ${formatPieceCount(group.works.length)}`
      };
    }

    function getApUnitNumber(apNumber) {
      const unit = AP_UNITS.find((candidate) => (
        apNumber >= candidate.start && apNumber <= candidate.end
      ));
      return unit ? unit.id : null;
    }

    function groupBySite(works) {
      const groups = new Map();
      works.forEach((work) => {
        const key = `${work.siteName}\u0000${work.coordinates.x}\u0000${work.coordinates.y}`;
        if (!groups.has(key)) {
          groups.set(key, {
            key,
            siteName: work.siteName,
            x: work.coordinates.x,
            y: work.coordinates.y,
            culture: work.culture,
            works: []
          });
        }
        groups.get(key).works.push(work);
      });
      return [...groups.values()]
        .map((group) => {
          const sortedWorks = group.works.slice().sort(
            (a, b) => a.apNumber - b.apNumber || a.id.localeCompare(b.id)
          );
          const cultures = [...new Set(sortedWorks.map((work) => work.culture))].sort();
          const apGroupLabel = formatApGroupLabel(sortedWorks);
          return {
            ...group,
            culture: cultures.length === 1 ? cultures[0] : 'mixed',
            cultures,
            works: sortedWorks,
            siteToken: createSiteToken([{ id:group.key }]),
            apLabel: apGroupLabel.slice(3),
            apGroupLabel
          };
        })
        .sort((a, b) => a.siteName.localeCompare(b.siteName) || a.x - b.x || a.y - b.y);
    }

    function groupByConfiguredRegion(works, unitId) {
      const groups = new Map();
      works.forEach((work) => {
        const region = MAP_REGIONS[work.region];
        if (!(work.unit === unitId && region?.unitIds.includes(unitId))) return;
        const key = `unit-${unitId}-region-${work.region}`;
        if (!groups.has(key)) {
          groups.set(key, {
            key,
            kind: 'region',
            regionId: work.region,
            parentKey: `unit-${unitId}`,
            unitId,
            siteName: MAP_REGIONS[work.region].nameEn,
            worldXTotal: 0,
            worldYTotal: 0,
            works: []
          });
        }
        const point = toWorldCoordinates(work);
        const group = groups.get(key);
        group.works.push(work);
        group.worldXTotal += point.x;
        group.worldYTotal += point.y;
      });
      return Object.keys(MAP_REGIONS)
        .filter((regionId) => MAP_REGIONS[regionId].unitIds.includes(unitId))
        .flatMap((regionId) => {
          const group = groups.get(`unit-${unitId}-region-${regionId}`);
          if (!group) return [];
          const sortedWorks = group.works.slice().sort(
            (first, second) => first.apNumber - second.apNumber || first.id.localeCompare(second.id)
          );
          const cultures = [...new Set(sortedWorks.map((work) => work.culture))].sort();
          const apGroupLabel = formatApGroupLabel(sortedWorks);
          return [{
            key: group.key,
            kind: group.kind,
            regionId: group.regionId,
            parentKey: group.parentKey,
            unitId: group.unitId,
            siteName: group.siteName,
            worldX: group.worldXTotal / sortedWorks.length,
            worldY: group.worldYTotal / sortedWorks.length,
            culture: cultures.length === 1 ? cultures[0] : 'mixed',
            cultures,
            works: sortedWorks,
            siteToken: createSiteToken([{ id:group.key }]),
            apLabel: apGroupLabel.slice(3),
            apGroupLabel,
            apUnits: [unitId]
          }];
        });
    }

    function getMapHierarchyLevel(siteCount, zoomScale) {
      if (siteCount <= 40) return 'site';
      if (zoomScale < 1.5) return 'overview';
      if (zoomScale < 2.5) return 'intermediate';
      return 'site';
    }

    function groupByRegionGrid(works, level) {
      const columns = 8;
      const rows = 4;
      const groups = new Map();
      works.forEach((work) => {
        const point = toWorldCoordinates({
          siteName: work.siteName,
          x: work.coordinates.x,
          y: work.coordinates.y
        });
        const column = Math.min(columns - 1, Math.max(0, Math.floor(point.x / (1600 / columns))));
        const row = Math.min(rows - 1, Math.max(0, Math.floor(point.y / (800 / rows))));
        const apUnit = getApUnitNumber(work.apNumber);
        const key = level === 'overview'
          ? `unit-${apUnit}`
          : `unit-${apUnit}-region-${row}-${column}`;
        if (!groups.has(key)) {
          groups.set(key, {
            key,
            kind: level === 'overview' ? 'unit' : 'region',
            isGridFallback: true,
            parentKey: level === 'overview' ? null : `unit-${apUnit}`,
            siteName: level === 'overview'
              ? `AP Unit ${apUnit}`
              : `AP Unit ${apUnit} · Geographic region ${row + 1}-${column + 1}`,
            worldXTotal: 0,
            worldYTotal: 0,
            works: []
          });
        }
        const group = groups.get(key);
        group.works.push(work);
        group.worldXTotal += point.x;
        group.worldYTotal += point.y;
      });
      return [...groups.values()].map((group) => {
        const sortedWorks = group.works.slice().sort(
          (first, second) => first.apNumber - second.apNumber || first.id.localeCompare(second.id)
        );
        const cultures = [...new Set(sortedWorks.map((work) => work.culture))].sort();
        const apGroupLabel = formatApGroupLabel(sortedWorks);
        return {
          key: group.key,
          kind: group.kind,
          isGridFallback: group.isGridFallback,
          parentKey: group.parentKey,
          siteName: group.siteName,
          worldX: group.worldXTotal / sortedWorks.length,
          worldY: group.worldYTotal / sortedWorks.length,
          culture: cultures.length === 1 ? cultures[0] : 'mixed',
          cultures,
          works: sortedWorks,
          siteToken: createSiteToken([{ id:group.key }]),
          apLabel: apGroupLabel.slice(3),
          apGroupLabel,
          apUnits: [...new Set(sortedWorks.map((work) => getApUnitNumber(work.apNumber)))]
            .filter(Boolean)
            .sort((first, second) => first - second)
        };
      }).sort((first, second) => (
        first.apUnits[0] - second.apUnits[0] || first.key.localeCompare(second.key)
      ));
    }

    function isUnmappedWork(work) {
      return work.unit === 10 && work.coordinates?.x === 0 && work.coordinates?.y === 0;
    }

    function buildMapGroups(works, zoomScale = 1, branch = null) {
      const unmappedWorks = works.filter(isUnmappedWork);
      works = works.filter((work) => !isUnmappedWork(work));
      const activeBranch = branch || {};
      const siteGroups = groupBySite(works);
      const asSiteGroups = (groups, parentKey = null) => groups.map((group) => ({
        ...group,
        kind: 'site',
        parentKey,
        apUnits: [...new Set(group.works.map((work) => getApUnitNumber(work.apNumber)))]
          .filter(Boolean)
          .sort((first, second) => first - second)
      }));
      const usesConfiguredRegions = typeof MAP_REGIONS !== 'undefined'
        && works.length > 0 && works.every((work) => (
        Number.isInteger(work.unit) && MAP_REGIONS[work.region]
      ));
      if (usesConfiguredRegions) {
        if (activeBranch.activeRegion) {
          const unitId = activeBranch.activeUnit || Number(activeBranch.selectedUnit);
          const region = groupByConfiguredRegion(works, unitId)
            .find((group) => group.key === activeBranch.activeRegion);
          return region ? asSiteGroups(groupBySite(region.works), region.key) : [];
        }
        const selectedUnitId = activeBranch.activeUnit
          || (activeBranch.selectedUnit !== 'all' ? Number(activeBranch.selectedUnit) : null);
        if (selectedUnitId) {
          return groupByConfiguredRegion(works, selectedUnitId);
        }
        return [...new Set(works.map((work) => work.unit))]
          .sort((first, second) => first - second)
          .flatMap((unitId) => groupByRegionGrid(
            works.filter((work) => work.unit === unitId),
            'overview'
          ).map((group) => ({
            ...group,
            isGridFallback:false,
            // Unit navigation counts all study works; its centroid is computed
            // above from mappable works only, never from neutral coordinates.
            works:[...group.works, ...unmappedWorks.filter(work => work.unit === unitId)]
          })));
      }
      if (activeBranch.activeRegion) {
        const region = groupByRegionGrid(works, 'intermediate')
          .find((group) => group.key === activeBranch.activeRegion);
        return region ? asSiteGroups(groupBySite(region.works), region.key) : [];
      }
      if (activeBranch.activeUnit) {
        const unitKey = `unit-${activeBranch.activeUnit}`;
        return groupByRegionGrid(
          works.filter((work) => getApUnitNumber(work.apNumber) === activeBranch.activeUnit),
          'intermediate'
        ).map((group) => ({ ...group, parentKey:unitKey }));
      }
      if (siteGroups.length <= 40) return asSiteGroups(siteGroups);
      const level = getMapHierarchyLevel(siteGroups.length, zoomScale);
      if (level !== 'site') return groupByRegionGrid(works, level);
      return asSiteGroups(siteGroups);
    }

    function buildMapGroupCandidates(works, zoomScale = 1, branch = null) {
      const activeBranch = branch || {};
      const configuredGroups = buildMapGroups(works, zoomScale, activeBranch);
      const usesConfiguredRegions = typeof MAP_REGIONS !== 'undefined'
        && works.length > 0 && works.every((work) => (
        Number.isInteger(work.unit) && MAP_REGIONS[work.region]
      ));
      if (usesConfiguredRegions) {
        if (configuredGroups.every((group) => group.kind === 'region')) {
          const denseConfiguredGroups = configuredGroups.map((group) => ({
            ...group,
            isGridFallback: false,
            isDenseFallback: true
          }));
          return [configuredGroups, denseConfiguredGroups];
        }
        const compactConfiguredGroups = configuredGroups.map((group) => ({
          ...group,
          // A long list of AP numbers can exceed the compact capsule itself.
          // Full location and AP identities remain in its accessible title.
          apLabel: group.kind === 'site' && group.works.length > 1
            ? formatPieceCount(group.works.length) : group.apLabel,
          isGridFallback: true
        }));
        if (configuredGroups.length >= 10 && configuredGroups.every(group => group.kind === 'unit')) {
          const denseUnitNavigation = configuredGroups.map(group => ({
            ...group,
            isGridFallback:false,
            isDenseFallback:true
          }));
          return [configuredGroups, compactConfiguredGroups, denseUnitNavigation];
        }
        return [configuredGroups, compactConfiguredGroups];
      }
      works = works.filter((work) => !isUnmappedWork(work));
      const siteGroups = groupBySite(works);
      if (activeBranch.activeUnit || activeBranch.activeRegion) {
        return [buildMapGroups(works, zoomScale, activeBranch)];
      }
      const units = groupByRegionGrid(works, 'overview');
      const level = getMapHierarchyLevel(siteGroups.length, zoomScale);
      if (level === 'overview') return [units];
      const regions = groupByRegionGrid(works, 'intermediate');
      if (level === 'intermediate') return [regions, units];
      const sites = siteGroups.map((group) => ({
        ...group,
        kind: 'site',
        parentKey: null,
        apUnits: [...new Set(group.works.map((work) => getApUnitNumber(work.apNumber)))]
          .filter(Boolean)
          .sort((first, second) => first - second)
      }));
      return [sites, regions, units];
    }

    function getMapScreenScale(width, height, zoomScale = 1) {
      const renderedScale = Math.min(width / 1600, height / 800);
      const visibleScale = Number.isFinite(renderedScale) && renderedScale > 0
        ? renderedScale
        : 0.23;
      return visibleScale * zoomScale;
    }

    function isSingleWorkSiteGroup(group) {
      return group.kind === 'site' && group.works.length === 1;
    }

    function getMarkerMetrics(
      apLabel,
      isSingle,
      screenScale,
      isCompact = false,
      isDense = false
    ) {
      const scale = Math.max(0.05, screenScale);
      const fontSize = 10 / scale;
      const title = typeof apLabel === 'object' ? apLabel.title : String(apLabel);
      const subtitle = typeof apLabel === 'object' ? apLabel.subtitle : '';
      const titleFontSize = (isDense ? 9 : 11) / scale;
      const subtitleFontSize = (isDense ? 8 : 10) / scale;
      const visualHeight = (isDense ? (scale < 0.21 ? 44 : 50) : isSingle || isCompact ? 22 : 38) / scale;
      const visualWidthPx = isDense
        ? 104
        : isSingle
        ? 22
        : isCompact
          ? Math.max(38, Math.min(108, title.length * 6.4 + 16))
          : Math.max(48, title.length * 6.5 + 20, subtitle.length * 5.8 + 20);
      const visualWidth = visualWidthPx / scale;
      return {
        fontSize,
        titleFontSize,
        subtitleFontSize,
        visualWidth,
        visualHeight,
        cornerRadius: visualHeight / 2,
        hitWidth: isDense ? 110 / scale : Math.max(44 / scale, visualWidth * 1.12),
        hitHeight: (isDense && scale >= 0.21 ? 50 : 44) / scale
      };
    }

    function getExpandedPinMetrics(screenScale) {
      const scale = Math.max(0.05, screenScale);
      return {
        fontSize: 10 / scale,
        visualDiameter: 22 / scale,
        hitWidth: 44 / scale,
        hitHeight: 44 / scale
      };
    }

    function expandedPinPositions(
      group,
      center,
      screenScale = 0.5,
      obstacleBounds = [],
      allowedBounds
    ) {
      allowedBounds = allowedBounds || { left:0, right:1600, top:0, bottom:800 };
      const metrics = getExpandedPinMetrics(screenScale);
      const count = group.works.length;
      if (!count) return [];
      const minimumRadius = metrics.hitWidth + 6 / Math.max(0.05, screenScale);
      const positionsFit = (positions) => positions.every((position, index) => {
        if (
          position.bounds.left < allowedBounds.left
          || position.bounds.right > allowedBounds.right
          || position.bounds.top < allowedBounds.top
          || position.bounds.bottom > allowedBounds.bottom
        ) return false;
        return obstacleBounds.every((bounds) => (
          !markerBoundsOverlap(position.bounds, bounds)
        )) && positions.slice(0, index).every((other) => (
          !markerBoundsOverlap(position.bounds, other.bounds)
        ));
      });
      const placeAtAngles = (angles, radius) => group.works.map((work, index) => {
        const x = center.x + Math.cos(angles[index]) * radius;
        const y = center.y + Math.sin(angles[index]) * radius;
        return { work, x, y, bounds: getMarkerBounds({ x, y }, metrics) };
      });
      const fullCircleRadius = count === 1
        ? minimumRadius
        : Math.max(minimumRadius, metrics.hitWidth / (2 * Math.sin(Math.PI / count)));
      for (let turn = 0; turn < 32; turn += 1) {
        const rotation = -Math.PI / 2 + turn * Math.PI / 16;
        const angles = group.works.map((work, index) => (
          rotation + Math.PI * 2 * index / count
        ));
        const positions = placeAtAngles(angles, fullCircleRadius);
        if (positionsFit(positions)) return positions;
      }
      const arcStep = count === 1 ? 0 : Math.PI / (count - 1);
      const arcRadius = count === 1
        ? minimumRadius
        : Math.max(minimumRadius, metrics.hitWidth / (2 * Math.sin(arcStep / 2)));
      for (const start of [0, Math.PI / 2, Math.PI, -Math.PI / 2]) {
        const angles = group.works.map((work, index) => start + arcStep * index);
        const positions = placeAtAngles(angles, arcRadius);
        if (positionsFit(positions)) return positions;
      }
      for (const direction of [1, -1]) {
        for (let columnCount = count; columnCount >= 1; columnCount -= 1) {
          let positions = group.works.map((work, index) => {
            const row = Math.floor(index / columnCount);
            const columnsInRow = Math.min(columnCount, count - row * columnCount);
            const column = index % columnCount;
            const x = center.x + (column - (columnsInRow - 1) / 2) * metrics.hitWidth;
            const y = center.y + direction * (row + 1) * metrics.hitHeight;
            return { work, x, y, bounds: getMarkerBounds({ x, y }, metrics) };
          });
          const outerBounds = positions.reduce((bounds, position) => ({
            left: Math.min(bounds.left, position.bounds.left),
            right: Math.max(bounds.right, position.bounds.right),
            top: Math.min(bounds.top, position.bounds.top),
            bottom: Math.max(bounds.bottom, position.bounds.bottom)
          }), { left:Infinity, right:-Infinity, top:Infinity, bottom:-Infinity });
          const shiftX = outerBounds.left < allowedBounds.left
            ? allowedBounds.left - outerBounds.left
            : Math.min(0, allowedBounds.right - outerBounds.right);
          const shiftY = outerBounds.top < allowedBounds.top
            ? allowedBounds.top - outerBounds.top
            : Math.min(0, allowedBounds.bottom - outerBounds.bottom);
          positions = positions.map((position) => {
            const x = position.x + shiftX;
            const y = position.y + shiftY;
            return { ...position, x, y, bounds: getMarkerBounds({ x, y }, metrics) };
          });
          if (positionsFit(positions)) return positions;
        }
      }
      const columnLimit = Math.ceil((allowedBounds.right - allowedBounds.left) / metrics.hitWidth);
      const rowLimit = Math.ceil((allowedBounds.bottom - allowedBounds.top) / metrics.hitHeight);
      const candidates = [];
      for (let row = -rowLimit; row <= rowLimit; row += 1) {
        for (let column = -columnLimit; column <= columnLimit; column += 1) {
          if (row === 0 && column === 0) continue;
          const x = center.x + column * metrics.hitWidth;
          const y = center.y + row * metrics.hitHeight;
          const bounds = getMarkerBounds({ x, y }, metrics);
          if (
            bounds.left < allowedBounds.left || bounds.right > allowedBounds.right
            || bounds.top < allowedBounds.top || bounds.bottom > allowedBounds.bottom
          ) continue;
          candidates.push({
            x,
            y,
            bounds,
            distance: column ** 2 + row ** 2,
            angle: Math.atan2(row, column)
          });
        }
      }
      candidates.sort((first, second) => (
        first.distance - second.distance
        || first.angle - second.angle
        || first.y - second.y
        || first.x - second.x
      ));
      const spiderPositions = [];
      for (const work of group.works) {
        const candidate = candidates.find((position) => (
          obstacleBounds.every((bounds) => !markerBoundsOverlap(position.bounds, bounds))
          && spiderPositions.every((other) => (
            !markerBoundsOverlap(position.bounds, other.bounds)
          ))
        ));
        if (!candidate) break;
        spiderPositions.push({
          work,
          x: candidate.x,
          y: candidate.y,
          bounds: candidate.bounds
        });
      }
      if (spiderPositions.length === count) return spiderPositions;
      throw new Error('Unable to place expanded AP pins inside the map');
    }

    function getMarkerBounds(center, metrics) {
      return {
        left: center.x - metrics.hitWidth / 2,
        right: center.x + metrics.hitWidth / 2,
        top: center.y - metrics.hitHeight / 2,
        bottom: center.y + metrics.hitHeight / 2
      };
    }

    function markerBoundsOverlap(first, second) {
      return !(
        first.right <= second.left
        || first.left >= second.right
        || first.bottom <= second.top
        || first.top >= second.bottom
      );
    }

    function expandMarkerBounds(bounds, amount) {
      return {
        left: bounds.left - amount,
        right: bounds.right + amount,
        top: bounds.top - amount,
        bottom: bounds.bottom + amount
      };
    }

    function createSpatialHash(cellSize) {
      const cells = new Map();
      function visitCellKeys(bounds, visitor) {
        const firstColumn = Math.floor(bounds.left / cellSize);
        const lastColumn = Math.floor(bounds.right / cellSize);
        const firstRow = Math.floor(bounds.top / cellSize);
        const lastRow = Math.floor(bounds.bottom / cellSize);
        for (let column = firstColumn; column <= lastColumn; column += 1) {
          for (let row = firstRow; row <= lastRow; row += 1) {
            visitor(`${column}:${row}`);
          }
        }
      }
      return {
        insert(bounds, item) {
          visitCellKeys(bounds, (key) => {
            if (!cells.has(key)) cells.set(key, []);
            cells.get(key).push(item);
          });
        },
        query(bounds) {
          const matches = new Set();
          visitCellKeys(bounds, (key) => {
            (cells.get(key) || []).forEach((item) => matches.add(item));
          });
          return [...matches];
        }
      };
    }

    function findNearestAvailableMarkerSlot(anchor, metrics, screenScale, candidateFits) {
      const scale = Math.max(0.05, screenScale);
      const step = 3 / scale;
      const minimumX = metrics.hitWidth / 2;
      const maximumX = 1600 - metrics.hitWidth / 2;
      const minimumY = metrics.hitHeight / 2;
      const maximumY = 800 - metrics.hitHeight / 2;
      const columnCount = Math.ceil((maximumX - minimumX) / step);
      const rowCount = Math.ceil((maximumY - minimumY) / step);
      let nearest = null;
      let nearestDistance = Infinity;
      for (let row = 0; row <= rowCount; row += 1) {
        const y = Math.min(maximumY, minimumY + row * step);
        for (let column = 0; column <= columnCount; column += 1) {
          const x = Math.min(maximumX, minimumX + column * step);
          const candidate = { x, y };
          if (!candidateFits(candidate)) continue;
          const distance = (x - anchor.x) ** 2 + (y - anchor.y) ** 2;
          if (distance < nearestDistance) {
            nearest = candidate;
            nearestDistance = distance;
          }
        }
      }
      return nearest;
    }

    function layoutSiteMarkers(
      groups,
      screenScale = 0.5,
      project = toWorldCoordinates,
      visibleWorldBounds = null
    ) {
      const positioned = [];
      const scale = Math.max(0.05, screenScale);
      const gap = 6 / scale;
      const packingBounds = visibleWorldBounds || {
        left: 0,
        right: 1600,
        top: 0,
        bottom: 800
      };
      const prepared = groups.map((group) => {
        const markerText = typeof getMapGroupText === 'function'
          ? getMapGroupText(group)
          : { title:group.siteName, subtitle:group.apGroupLabel };
        const isSingleWorkSite = group.kind === 'site' && group.works.length === 1;
        const usesSingleLineFallback = group.isGridFallback === true;
        const usesDenseFallback = group.isDenseFallback === true;
        return {
          ...group,
          markerText,
          markerMetrics: getMarkerMetrics(
            isSingleWorkSite || usesSingleLineFallback ? group.apLabel : markerText,
            isSingleWorkSite,
            scale,
            usesSingleLineFallback,
            usesDenseFallback
          )
        };
      });
      if (prepared.length && prepared.every((group) => group.isDenseFallback === true)) {
        const availableWidth = packingBounds.right - packingBounds.left;
        const availableHeight = packingBounds.bottom - packingBounds.top;
        const denseGap = 4 / scale;
        const hitWidth = Math.max(...prepared.map((group) => group.markerMetrics.hitWidth));
        let hitHeight = Math.max(...prepared.map((group) => group.markerMetrics.hitHeight));
        const columnCount = Math.floor(
          (availableWidth + denseGap) / (hitWidth + denseGap)
        );
        const rowCount = Math.ceil(prepared.length / columnCount);
        // A full country list may need six rows on a phone. Compress only
        // when needed, preserving the 44px minimum touch target.
        const compactHeight = 44 / scale;
        if (columnCount > 0 && rowCount * hitHeight + (rowCount - 1) * denseGap > availableHeight
          && rowCount * compactHeight + (rowCount - 1) * denseGap <= availableHeight + 1e-6) {
          hitHeight = compactHeight;
          for (const group of prepared) {
            group.markerMetrics.hitHeight = hitHeight;
            group.markerMetrics.visualHeight = Math.min(group.markerMetrics.visualHeight, hitHeight);
            group.markerMetrics.cornerRadius = group.markerMetrics.visualHeight / 2;
          }
        }
        const totalHeight = rowCount * hitHeight + (rowCount - 1) * denseGap;
        if (columnCount < 1 || totalHeight > availableHeight) {
          throw new Error('Unable to place configured region capsules without a marker collision');
        }
        const firstY = packingBounds.top
          + (availableHeight - totalHeight) / 2
          + hitHeight / 2;
        return prepared.map((group, index) => {
          const row = Math.floor(index / columnCount);
          const rowItemCount = Math.min(
            columnCount,
            prepared.length - row * columnCount
          );
          const rowWidth = rowItemCount * hitWidth + (rowItemCount - 1) * denseGap;
          const firstX = packingBounds.left
            + (availableWidth - rowWidth) / 2
            + hitWidth / 2;
          const display = {
            x: firstX + (index % columnCount) * (hitWidth + denseGap),
            y: firstY + row * (hitHeight + denseGap)
          };
          const anchor = project(group);
          return {
            ...group,
            anchorX: anchor.x,
            anchorY: anchor.y,
            displayX: display.x,
            displayY: display.y,
            markerMetrics: group.markerMetrics,
            bounds: getMarkerBounds(display, group.markerMetrics)
          };
        });
      }
      const largestCell = prepared.reduce(
        (largest, group) => Math.max(
          largest,
          group.markerMetrics.hitWidth,
          group.markerMetrics.hitHeight
        ),
        64
      );
      const spatialHash = createSpatialHash(largestCell + gap);
      prepared.forEach((group) => {
        const anchor = project(group);
        const metrics = group.markerMetrics;
        function candidateFits(candidate) {
          const bounds = getMarkerBounds(candidate, metrics);
          if (
            bounds.left < packingBounds.left || bounds.right > packingBounds.right
            || bounds.top < packingBounds.top || bounds.bottom > packingBounds.bottom
          ) return false;
          const expandedBounds = expandMarkerBounds(bounds, gap);
          const nearby = spatialHash.query(expandedBounds);
          return !nearby.some((site) => (
            markerBoundsOverlap(expandedBounds, site.bounds)
          ));
        }
        let display = candidateFits(anchor) ? anchor : null;
        const gridStep = 6 / scale;
        const ringCount = Math.ceil(1600 / gridStep);
        for (let ring = 1; ring <= ringCount && !display; ring += 1) {
          for (let offset = -ring; offset <= ring; offset += 1) {
            const candidates = [
              { x:anchor.x + offset * gridStep, y:anchor.y - ring * gridStep },
              { x:anchor.x + offset * gridStep, y:anchor.y + ring * gridStep }
            ];
            display = candidates.find(candidateFits) || null;
            if (display) break;
          }
          for (let offset = -ring + 1; offset < ring && !display; offset += 1) {
            const candidates = [
              { x:anchor.x - ring * gridStep, y:anchor.y + offset * gridStep },
              { x:anchor.x + ring * gridStep, y:anchor.y + offset * gridStep }
            ];
            display = candidates.find(candidateFits) || null;
          }
        }
        if (!display) {
          display = findNearestAvailableMarkerSlot(
            anchor,
            metrics,
            scale,
            candidateFits
          );
        }
        if (!display) throw new Error(`Unable to place ${group.siteName} without a marker collision`);
        const positionedGroup = {
          ...group,
          anchorX: anchor.x,
          anchorY: anchor.y,
          displayX: display.x,
          displayY: display.y,
          markerMetrics: metrics,
          bounds: getMarkerBounds(display, metrics)
        };
        positioned.push(positionedGroup);
        spatialHash.insert(positionedGroup.bounds, positionedGroup);
      });
      return positioned;
    }

    function layoutMapGroups(
      works,
      zoomScale = 1,
      screenScale = 0.5,
      branch = null,
      visibleWorldBounds = null,
      densePackingBounds = null
    ) {
      let collisionError = null;
      const candidates = buildMapGroupCandidates(works, zoomScale, branch);
      for (const groups of candidates) {
        try {
          return layoutSiteMarkers(
            groups,
            screenScale,
            toWorldCoordinates,
            groups.every(group => group.isDenseFallback === true || group.isGridFallback === true)
              ? densePackingBounds || visibleWorldBounds
              : visibleWorldBounds
          );
        } catch (error) {
          if (!String(error?.message).startsWith('Unable to place ')) throw error;
          collisionError = error;
        }
      }
      // Short unit labels keep the overview usable when full AP ranges cannot
      // fit on a narrow map. Geographic anchors and 44px hit targets stay intact.
      const unitGroups = candidates.find(groups => groups.length && groups.every(group => group.kind === 'unit'));
      if (collisionError && unitGroups) {
        try {
          return layoutSiteMarkers(
            unitGroups.map(group => ({
              ...group,
              apLabel: `U${group.apUnits[0]}`,
              isGridFallback: true,
              isDenseFallback: false
            })),
            screenScale,
            toWorldCoordinates,
            visibleWorldBounds
          );
        } catch (error) {
          if (!String(error?.message).startsWith('Unable to place ')) throw error;
          collisionError = error;
        }
      }
      if (collisionError) throw collisionError;
      return [];
    }

    function assert(condition, message) {
      if (!condition) throw new Error(`Development assertion failed: ${message}`);
    }

    function clampTransform({ x, y, scale }) {
      const boundedScale = Math.min(3, Math.max(1, scale));
      const minimumX = 1600 * (1 - boundedScale);
      const minimumY = 800 * (1 - boundedScale);
      return {
        scale: boundedScale,
        x: Math.min(0, Math.max(minimumX, x)),
        y: Math.min(0, Math.max(minimumY, y))
      };
    }

    function getDensePackingBounds(transform, viewport) {
      if (!viewport || viewport.width <= 0 || viewport.height <= 0) return null;
      const base = Math.min(viewport.width / 1600, viewport.height / 800);
      const scale = Math.max(1, transform.scale);
      const offsetX = (viewport.width - 1600 * base) / 2;
      const offsetY = (viewport.height - 800 * base) / 2;
      // The dense fallback is navigation, so it may use visible letterboxing.
      // Keep 8px canvas margins and a 48px gutter clear of zoom controls.
      return {
        left: ((8 - offsetX) / base - transform.x) / scale,
        right: ((viewport.width - 48 - offsetX) / base - transform.x) / scale,
        top: ((8 - offsetY) / base - transform.y) / scale,
        bottom: ((viewport.height - 8 - offsetY) / base - transform.y) / scale
      };
    }

    function getVisibleWorldBounds(transform) {
      const scale = Math.max(1, transform.scale);
      return {
        left: Math.max(0, -transform.x / scale),
        right: Math.min(1600, (1600 - transform.x) / scale),
        top: Math.max(0, -transform.y / scale),
        bottom: Math.min(800, (800 - transform.y) / scale)
      };
    }

    function cycleIndex(index, length, direction) {
      return length ? (index + direction + length) % length : 0;
    }

    function zoomAroundPoint(transform, nextScale, point = { x:800, y:400 }) {
      const boundedScale = Math.min(3, Math.max(1, nextScale));
      const contentX = (point.x - transform.x) / transform.scale;
      const contentY = (point.y - transform.y) / transform.scale;
      return clampTransform({
        scale: boundedScale,
        x: point.x - contentX * boundedScale,
        y: point.y - contentY * boundedScale
      });
    }

    function clientDeltaToViewBox(deltaX, deltaY, width, height) {
      const renderedScale = Math.min(width / 1600, height / 800);
      return { x: deltaX / renderedScale, y: deltaY / renderedScale };
    }

    function runDevelopmentAssertions() {
      const overZoomed = clampTransform({ x: 99999, y: 99999, scale: 9 });
      assert(overZoomed.scale === 3 && overZoomed.x === 0 && overZoomed.y === 0,
        'clampTransform() should cap zoom and keep the top-left world edge reachable');
      const farEdge = clampTransform({ x: -99999, y: -99999, scale: 3 });
      assert(farEdge.x === -3200 && farEdge.y === -1600,
        'clampTransform() should keep the right and bottom world edges reachable without blank space');
      const underZoomed = clampTransform({ x: 100, y: 100, scale: 0 });
      assert(underZoomed.scale === 1 && underZoomed.x === 0 && underZoomed.y === 0,
        'clampTransform() should return the 1× overview to its origin');
      assert(state.selectedSiteIndex === 0,
        'selection state should start at the first work at a site');
      assert(state.transform.scale === 1,
        'map navigation state should start at the overview scale');
      assert(cycleIndex(0, 3, -1) === 2 && cycleIndex(2, 3, 1) === 0,
        'site cycling should wrap in both directions');
      const centeredZoom = zoomAroundPoint({ x:0, y:0, scale:1 }, 2);
      assert(centeredZoom.x === -800 && centeredZoom.y === -400,
        'zoom should preserve the visible world center');
      const pannedZoom = zoomAroundPoint({ x:-400, y:-200, scale:2 }, 3);
      assert(pannedZoom.x === -1000 && pannedZoom.y === -500,
        'zoom should preserve the current center after panning');
      const letterboxedDelta = clientDeltaToViewBox(100, 100, 800, 800);
      assert(letterboxedDelta.x === 200 && letterboxedDelta.y === 200,
        'pointer deltas should use one meet scale when the SVG is letterboxed');
      const worldSvg = document.querySelector('.map-svg');
      assert(getComputedStyle(document.querySelector('.world-geography')).pointerEvents === 'none',
        'non-interactive geography should leave the background pan surface hittable');
      assert(document.getElementById('panSurface').nextElementSibling?.classList.contains('world-geography'),
        'the pan surface should sit behind geography and markers without covering them');
      assert(worldSvg.getAttribute('viewBox') === '0 0 1600 800',
        'art map should render the complete 1600 × 800 world overview');
      assert(worldSvg.querySelectorAll('.world-geography .region-path').length >= 100,
        'art map should reuse the detailed original-world geography');
      ARTWORKS.forEach((work) => {
        const projected = toWorldCoordinates({
          siteName: work.siteName,
          x: work.coordinates.x,
          y: work.coordinates.y
        });
        assert(projected.x >= 0 && projected.x <= 1600 && projected.y >= 0 && projected.y <= 800,
          `${work.id} should project inside the world map`);
      });
      const expectedCounts = {
        all: 36,
        ancientNearEast: 6,
        egypt: 9,
        greece: 10,
        etruscan: 3,
        rome: 8
      };
      Object.entries(expectedCounts).forEach(([culture, expected]) => {
        const actual = filterWorks(ARTWORKS, {
          unit: '2',
          culture,
          period: '',
          workType: '',
          search: ''
        }).length;
        assert(actual === expected, `Expected ${expected} ${culture} works, received ${actual}`);
      });
      assert(normalize('  Ａthens  ') === 'athens', 'normalize() should apply NFKC, trim, and lowercase');
      assert(compactApNumbers([35, 39, 40]) === '35, 39–40',
        'compactApNumbers() should preserve gaps between AP ranges');
      assert(compactApNumbers([41, 42, 43, 44, 45, 46, 47]) === '41–47',
        'compactApNumbers() should merge consecutive AP numbers');
      const gizaGroups = groupBySite(ARTWORKS.filter((work) => work.siteName === 'Giza'));
      assert(gizaGroups.length === 1 && gizaGroups[0].works.length === 2,
        'groupBySite() should deterministically combine an exact site');
      [getMapScreenScale(362, 330), 0.5].forEach((screenScale) => {
        const fallbackViewport = { width:1600 * screenScale, height:800 * screenScale };
        const laidOutSites = layoutMapGroups(ARTWORKS, 1, screenScale, {}, null,
          getDensePackingBounds({ x:0, y:0, scale:1 }, fallbackViewport));
        laidOutSites.forEach((site, index) => {
          laidOutSites.slice(index + 1).forEach((other) => {
            assert(!markerBoundsOverlap(site.bounds, other.bounds),
              `${site.siteName} and ${other.siteName} marker bounds should not overlap`);
          });
        });
      });
      assert(/^[a-zA-Z0-9_-]+$/.test(createSiteToken([{ id:'rome\u0000forty one' }])),
        'createSiteToken() should be safe for attribute selectors');
    }

    function assertRenderedMarkerSemantics() {
      document.querySelectorAll('.site-marker').forEach((marker) => {
        assert(marker.getAttribute('tabindex') === '0' && marker.getAttribute('role') === 'button',
          'site markers should expose keyboard button semantics');
      });
    }

    function appendOption(select, value, label) {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = label;
      select.append(option);
    }

    function populateSelect(select, values, placeholder) {
      select.replaceChildren();
      appendOption(select, '', placeholder);
      [...new Set(values)].sort((a, b) => a.localeCompare(b)).forEach((value) => {
        appendOption(select, value, value);
      });
    }

    function getWorksForUnit(unit = state.unit) {
      return unit === 'all'
        ? ARTWORKS
        : ARTWORKS.filter((work) => work.unit === Number(unit));
    }

    function populateUnitOptions() {
      const unitFilter = document.getElementById('unitFilter');
      unitFilter.replaceChildren();
      appendOption(unitFilter, 'all', 'All Units');
      AP_UNITS.filter((unit) => ARTWORKS.some((work) => work.unit === unit.id))
        .forEach((unit) => {
          appendOption(
            unitFilter,
            String(unit.id),
            `U${unit.id} · ${unit.nameEn} · AP ${unit.start}-${unit.end}`
          );
        });
      unitFilter.value = state.unit;
    }

    function renderDependentFilterOptions() {
      const unitWorks = getWorksForUnit();
      if (!unitWorks.some((work) => work.period === state.period)) state.period = '';
      if (!unitWorks.some((work) => work.workType === state.workType)) state.workType = '';
      const periodFilter = document.getElementById('periodFilter');
      const typeFilter = document.getElementById('typeFilter');
      populateSelect(periodFilter, unitWorks.map((work) => work.period), '全部时期');
      populateSelect(typeFilter, unitWorks.map((work) => work.workType), '全部类型');
      periodFilter.value = state.period;
      typeFilter.value = state.workType;
      document.dispatchEvent?.(new Event('art-filter-context'));
    }

    function updateCultureFilterSelection(container, cultureId) {
      let selectedButton = null;
      container.querySelectorAll('[data-culture]').forEach((button) => {
        const selected = button.dataset.culture === cultureId;
        button.setAttribute('aria-pressed', String(selected));
        if (selected) selectedButton = button;
      });
      return selectedButton;
    }

    function renderCultureFilters() {
      const container = document.getElementById('cultureFilters');
      const unitId = state.unit === 'all' ? null : Number(state.unit);
      const unitConfig = unitId === null ? null : UNIT_FILTER_CONFIG[unitId];
      container.hidden = !unitConfig?.showCultureFilters;
      container.replaceChildren();
      if (!unitConfig?.showCultureFilters) return;
      ['all', ...unitConfig.cultureIds].forEach((cultureId) => {
        const button = document.createElement('button');
        button.className = 'filter-pill';
        button.type = 'button';
        button.dataset.culture = cultureId;
        button.setAttribute('aria-pressed', String(state.culture === cultureId));
        const allLabel = unitId === 3 || unitId === 5 || unitId === 7 || unitId === 8 || unitId === 9 || unitId === 10
          ? 'All traditions'
          : unitId === 4
            ? 'All movements'
            : 'All cultures';
        button.textContent = cultureId === 'all'
          ? allLabel
          : getCultureLabel(cultureId, 'en');
        button.addEventListener('click', () => {
          clearHierarchyBranch();
          state.culture = cultureId;
          updateCultureFilterSelection(container, state.culture);
          fitCurrentWorks();
        });
        container.append(button);
      });
    }

    function syncFilterControls() {
      document.getElementById('unitFilter').value = state.unit;
      renderDependentFilterOptions();
      renderCultureFilters();
      document.getElementById('searchInput').value = state.search;
    }

    function fitMapToWorks(works) {
      works = works.filter((work) => !isUnmappedWork(work));
      if (!works.length) return;
      const points = works.map((work) => toWorldCoordinates(work)).filter((point) => (
        Number.isFinite(point.x) && Number.isFinite(point.y)
      ));
      if (!points.length) {
        state.transform = { x:0, y:0, scale:1 };
        return;
      }
      const left = Math.min(...points.map((point) => point.x));
      const right = Math.max(...points.map((point) => point.x));
      const top = Math.min(...points.map((point) => point.y));
      const bottom = Math.max(...points.map((point) => point.y));
      // Geometry tests and non-DOM consumers keep the original 160-unit margin.
      const bounds = typeof document !== 'undefined'
        ? document.querySelector('.map-svg')?.getBoundingClientRect() : null;
      const screenScale = bounds ? Math.min(bounds.width / 1600, bounds.height / 800) : 0;
      const padding = screenScale > 0 ? Math.min(80, bounds.width * .16) / screenScale : 160;
      const scale = Math.min(3, Math.max(1, Math.min(
        1600 / Math.max(1, right - left + padding * 2),
        800 / Math.max(1, bottom - top + padding * 2)
      )));
      const nextTransform = clampTransform({
        scale,
        x: 800 - (left + right) / 2 * scale,
        y: 400 - (top + bottom) / 2 * scale
      });
      state.transform = [nextTransform.x, nextTransform.y, nextTransform.scale]
        .every(Number.isFinite)
        ? nextTransform
        : { x:0, y:0, scale:1 };
    }

    let filteredFocusTimer = null;
    function cancelFilteredFocus() {
      clearTimeout(filteredFocusTimer);
      filteredFocusTimer = null;
    }
    function fitCurrentWorks() {
      cancelFilteredFocus();
      fitMapToWorks(filterWorks(ARTWORKS, state));
      render(); applyTransform();
    }
    function focusSelectedWork() {
      cancelFilteredFocus();
      const work = ARTWORKS.find(work => work.id === state.selectedId);
      if (!work) return;
      fitMapToWorks([work]);
      state.activeUnit = work.unit;
      state.activeRegion = groupByConfiguredRegion(filterWorks(ARTWORKS, state), work.unit)
        .find(group => group.works.some(item => item.id === work.id))?.key || null;
    }

    const markerLayer = document.getElementById('markerLayer');
    const detailPanel = document.getElementById('detailPanel');
    const mapPanel = document.getElementById('mapPanel');
    const mapViewport = document.getElementById('mapViewport');
    const expandedPinList = document.getElementById('expandedPinList');
    const imageDialog = document.getElementById('imageDialog');
    let imageDialogTrigger = null;
    let clearImageDialogViewport = null;
    let artworkMediaRenderGeneration = 0;
    let markerLayoutFrame = null;

    function getRenderedMarkerScale() {
      const bounds = document.querySelector('.map-svg').getBoundingClientRect();
      return getMapScreenScale(bounds.width, bounds.height, state.transform.scale);
    }

    function focusSiteMarker(siteToken) {
      markerLayer.querySelector(`[data-site-token="${siteToken}"]`)?.focus();
    }

    function getHierarchyChildFocusToken(groups, parentKey) {
      return groups.find((group) => group.parentKey === parentKey)?.siteToken || null;
    }

    function focusHierarchyChild(parentKey, groups) {
      const childToken = getHierarchyChildFocusToken(groups, parentKey);
      if (!childToken) return false;
      focusSiteMarker(childToken);
      return true;
    }

    function focusExpandedWorkPin(workId) {
      document.querySelector(`[data-work-id="${workId}"]`)?.focus();
    }

    function scheduleMarkerLayout() {
      if (markerLayoutFrame !== null) cancelAnimationFrame(markerLayoutFrame);
      markerLayoutFrame = requestAnimationFrame(() => render());
    }

    function applyTransform() {
      state.transform = clampTransform(state.transform);
      mapViewport.setAttribute(
        'transform',
        `translate(${state.transform.x} ${state.transform.y}) scale(${state.transform.scale})`
      );
    }

    function selectArtwork(workId, siteToken, restoreFocus = false) {
      state.selectedId = workId;
      state.selectedSiteIndex = 0;
      state.expandedSiteToken = siteToken;
      state.activeDetailTab = 'quick';
      focusSelectedWork();
      render();
      applyTransform();
      const revealed = revealSelectedArtwork();
      if (!revealed && restoreFocus) focusExpandedWorkPin(workId);
      return revealed;
    }

    function expandSiteGroup(group, restoreFocus = false) {
      cancelFilteredFocus();
      if (group.kind === 'unit') {
        state.activeUnit = group.apUnits[0];
        state.unit = String(state.activeUnit);
        state.culture = 'all';
        state.activeRegion = null;
        state.pendingFocusParentKey = group.key;
        state.expandedSiteToken = null;
        state.transform = zoomAroundPoint(
          state.transform,
          Math.max(1.5, state.transform.scale),
          { x:group.displayX, y:group.displayY }
        );
        fitMapToWorks(group.works);
        syncFilterControls();
        render();
        applyTransform();
        return;
      }
      if (group.kind === 'region') {
        state.activeUnit = group.apUnits[0];
        state.activeRegion = group.key;
        state.pendingFocusParentKey = group.key;
        state.expandedSiteToken = null;
        state.transform = zoomAroundPoint(
          state.transform,
          Math.max(2.5, state.transform.scale),
          { x:group.displayX, y:group.displayY }
        );
        fitMapToWorks(group.works);
        render();
        applyTransform();
        return;
      }
      if (isSingleWorkSiteGroup(group)) {
        const revealed = selectArtwork(group.works[0].id, group.siteToken);
        if (restoreFocus && !revealed) focusSiteMarker(group.siteToken);
        return;
      }
      state.expandedSiteToken = state.expandedSiteToken === group.siteToken ? null : group.siteToken;
      render();
      if (restoreFocus) focusSiteMarker(group.siteToken);
    }

    function cycleSite(group, direction) {
      state.selectedSiteIndex = cycleIndex(state.selectedSiteIndex, group.works.length, direction);
      state.selectedId = group.works[state.selectedSiteIndex].id;
      state.activeDetailTab = 'quick';
      focusSelectedWork();
      render();
      applyTransform();
      const label = direction < 0 ? '上一件同地点作品' : '下一件同地点作品';
      detailPanel.querySelector(`[aria-label="${label}"]`)?.focus();
    }

    function installImageFallback(image, work, replacementFactory = null, errorHandler = null) {
      image.addEventListener('error', () => {
        if (errorHandler) {
          errorHandler();
          return;
        }
        if (replacementFactory) {
          let mediaStage = image.parentNode;
          while (mediaStage && !mediaStage.classList?.contains('artwork-media-stage')) {
            mediaStage = mediaStage.parentNode;
          }
          const replacement = replacementFactory();
          mediaStage?.replaceChildren(replacement);
          replacement.focus?.();
          return;
        }
        const fallback = document.createElement('div');
        fallback.className = 'image-fallback';
        fallback.textContent = `${work.titleZh} · ${work.titleEn}`;
        image.replaceWith(fallback);
      }, { once:true });
    }

    function createStudyBlock(title, ...paragraphs) {
      const block = document.createElement('section');
      block.className = 'study-block';
      const heading = document.createElement('h3');
      heading.textContent = title;
      block.append(heading);
      paragraphs.filter(Boolean).forEach((value) => {
        const copy = document.createElement('p');
        copy.textContent = value;
        block.append(copy);
      });
      return block;
    }

    function getArtworkImages(work) {
      if (Array.isArray(work.images)) return work.images;
      return [{
        label:'Primary view',
        imageUrl:work.imageUrl,
        imageAlt:work.imageAlt,
        imageSourceName:work.imageSourceName,
        imageSourceUrl:work.imageSourceUrl
      }];
    }

    function getArtworkImageCredits(work) {
      const credits = IMAGE_CREDITS[work.id];
      return Array.isArray(credits) ? credits : [credits];
    }

    function createImageCredit(media, credit) {
      const line = document.createElement('p');
      line.className = 'image-credit';
      line.append(document.createTextNode(`图片：${credit.creatorOrInstitution} · `));
      const license = document.createElement('a');
      license.href = credit.licenseUrl;
      license.target = '_blank';
      license.rel = 'noopener noreferrer';
      license.textContent = credit.licenseName;
      line.append(license);
      line.append(document.createTextNode(' · '));
      const source = document.createElement('a');
      source.href = media.imageSourceUrl;
      source.target = '_blank';
      source.rel = 'noopener noreferrer';
      source.textContent = media.imageSourceName;
      line.append(source);
      return line;
    }

    function createRightsPlaceholder(work, media, privateMissing = false) {
      const reuseUnverified = (work.unit === 6 || work.unit === 7 || work.unit === 8 || work.unit === 9 || work.unit === 10) && media.imageUrl === null
        && typeof media.mediaStatus === 'string' && media.mediaStatus.trim();
      // An unverified reusable view is not evidence of an installed private image.
      const expectedPrivateMissing = privateMissing && !reuseUnverified;
      const panel = document.createElement('section');
      panel.className = 'rights-placeholder';
      panel.setAttribute('aria-label', `${work.titleEn}: ${reuseUnverified ? 'reusable image not yet verified' : 'public image unavailable'}`);
      if (expectedPrivateMissing) panel.tabIndex = -1;

      const icon = document.createElement('span');
      icon.className = 'rights-placeholder-icon';
      icon.setAttribute('aria-hidden', 'true');
      icon.textContent = '⌑';

      const title = document.createElement('h3');
      title.textContent = reuseUnverified
        ? 'Reusable image not yet verified'
        : 'Image unavailable in the public version';

      const explanation = document.createElement('p');
      explanation.textContent = reuseUnverified
        ? media.mediaStatus
        : '由于作品版权限制，公开版不显示图像。本地私人学习模式可显示完整视图。';

      panel.append(icon, title, explanation);
      if (expectedPrivateMissing) {
        const localStatus = document.createElement('p');
        localStatus.className = 'private-media-missing';
        localStatus.textContent = 'Private image not installed';
        panel.append(localStatus);
      }

      const source = document.createElement('a');
      source.className = 'rights-placeholder-source';
      source.href = media.imageSourceUrl;
      source.target = '_blank';
      source.rel = 'noopener noreferrer';
      source.textContent = 'View official source ↗';
      panel.append(source);
      return panel;
    }

    function summarizeComparisonField(value) {
      return String(value).split(/[，；。]/).map((part) => part.trim()).find(Boolean) || String(value);
    }

    function createComparisonAngle(work, comparison) {
      const exactLinks = [];
      if (work.culture === comparison.culture) exactLinks.push('同属一个文化传统');
      if (work.period === comparison.period) exactLinks.push(`同属 ${work.period}`);
      if (work.workType === comparison.workType) exactLinks.push(`同为 ${work.workType}`);
      if (work.medium === comparison.medium) exactLinks.push(`同用 ${work.medium}`);
      const connection = exactLinks.length
        ? exactLinks.join('、')
        : '两者分属不同类别，适合观察材料、用途与时代如何改变表现';
      return [
        `联系：${connection}。`,
        `形式：本作“${summarizeComparisonField(work.form)}”；对比“${summarizeComparisonField(comparison.form)}”。`,
        `功能：本作“${summarizeComparisonField(work.function)}”；对比“${summarizeComparisonField(comparison.function)}”。`,
        `语境：本作“${summarizeComparisonField(work.context)}”；对比“${summarizeComparisonField(comparison.context)}”。`
      ].join('');
    }

    function openImageDialog(work, media, credit, trigger, privateMediaErrorHandler = null) {
      imageDialogTrigger = trigger;
      const image = document.createElement('img');
      image.id = 'dialogImage';
      image.src = media.imageUrl;
      image.alt = media.imageAlt;
      if (privateMediaErrorHandler) {
        image.addEventListener('error', privateMediaErrorHandler, { once:true });
      }
      installImageFallback(image, work);
      document.getElementById('dialogMedia').replaceChildren(image);
      document.getElementById('dialogTitle').textContent = `${work.titleEn} · ${work.titleZh}`;
      document.getElementById('dialogCaption').textContent = media.imageAlt;
      document.getElementById('dialogCredit').textContent = `图片：${credit.creatorOrInstitution}`;
      const license = document.getElementById('dialogLicense');
      license.href = credit.licenseUrl;
      license.textContent = credit.licenseName;
      const source = document.getElementById('dialogSource');
      source.href = media.imageSourceUrl;
      source.textContent = media.imageSourceName;
      imageDialog.showModal();
      // A content-fitted iframe can extend beyond the host viewport. Keep the
      // native dialog inside the visible intersection, not the whole iframe.
      try {
        const hostFrame = window.frameElement;
        if (hostFrame && window.parent !== window) {
          const hostWindow = window.parent;
          const fitDialog = () => {
            if (!imageDialog.open) return;
            const bounds = hostFrame.getBoundingClientRect();
            const top = Math.max(0, -bounds.top);
            const bottom = Math.min(window.innerHeight, hostWindow.innerHeight - bounds.top);
            const height = bottom - top;
            if (height > 100) {
              Object.assign(imageDialog.style, {
                position:'fixed', overflow:'auto',
                top:`${top + 14}px`, bottom:'auto', marginTop:'0', marginBottom:'0',
                maxHeight:`${height - 28}px`
              });
              image.style.maxHeight = `${Math.max(100, height * 0.55)}px`;
            }
          };
          clearImageDialogViewport?.();
          hostWindow.addEventListener('scroll', fitDialog, true);
          hostWindow.addEventListener('resize', fitDialog);
          image.addEventListener('load', fitDialog);
          clearImageDialogViewport = () => {
            hostWindow.removeEventListener('scroll', fitDialog, true);
            hostWindow.removeEventListener('resize', fitDialog);
            image.removeEventListener('load', fitDialog);
          };
          fitDialog();
        }
      } catch (_) { /* Cross-origin hosts retain the native dialog layout. */ }
      document.getElementById('dialogClose').focus({ preventScroll:true });
    }

    function revealSelectedArtwork() {
      if (typeof window === 'undefined' || !window.matchMedia?.('(max-width:664px)')?.matches) return false;
      const heading = detailPanel.querySelector('[data-selected-artwork-title]');
      if (!heading) return false;
      focusSelectedArtworkHeading();
      heading.scrollIntoView({ block:'start', behavior:'instant' });

    }

    function focusSelectedArtworkHeading() {
      const heading = detailPanel.querySelector('[data-selected-artwork-title]');
      if (!heading) return;
      heading.focus({ preventScroll:true });
      if (document.activeElement !== heading) heading.focus();
    }

    function selectComparison(comparisonId) {
      const target = ARTWORKS.find((work) => work.id === comparisonId);
      if (!target) return;
      Object.assign(state, {
        unit:String(target.unit),
        culture:'all',
        period:'',
        workType:'',
        search:'',
        selectedId:target.id,

    function renderArtworkDetails(work, group) {

      const mediaItems = getArtworkImages(work);
      const credits = getArtworkImageCredits(work);
