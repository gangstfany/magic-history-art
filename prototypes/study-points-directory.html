<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study points directory · Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f9f4e8;color:#211f1c;font-family:"PingFang SC","Hiragino Sans GB",-apple-system,"Helvetica Neue",sans-serif;height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:12px 20px;border-bottom:1px solid #e7dcc6;background:#fffdf8;font-size:13px}header strong{color:#8b3a2f}header span{color:#6b6558}header a{color:#176369}iframe{display:block;width:100%;flex:1;min-height:0;border:0}.variants{display:flex;flex-wrap:wrap;gap:8px}.variants button{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid #e7dcc6;background:#fffdf8;color:#211f1c;font:inherit;font-weight:600;cursor:pointer}.variants button[aria-pressed=true]{background:#4b453d;color:white;border-color:#4b453d}.variants button:focus-visible{outline:2px solid #28708a;outline-offset:2px}.variant-note{flex-basis:100%;font-size:12px;margin:0;color:#6b6558}
</style>
<header><div><strong>Prototype · Study points directory</strong> <span>独立预览</span></div><nav class="variants" aria-label="预览样式"><button data-variant="a" aria-pressed="true">A · 紧凑胶囊</button><button data-variant="b" aria-pressed="false">B · 地点卡片</button><button data-variant="c" aria-pressed="false">C · 地区清单</button></nav><a href="../index.html">返回正式首页</a><p class="variant-note" id="variantNote">A：占用空间最少，让地图保持主角。</p></header>
<iframe id="preview" title="World History with study points directory preview" src="../index.html?studyDirectoryPreview=1"></iframe>
<script>
const preview=document.querySelector('#preview');
let variant=['a','b','c'].includes(new URLSearchParams(location.search).get('style'))?new URLSearchParams(location.search).get('style'):'a';
let renderPreview=null;
function setVariant(next){
 variant=next;
 document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===variant)));
 document.querySelector('#variantNote').textContent={a:'A：占用空间最少，让地图保持主角。',b:'B：地点与条目数量更醒目，最接近现有卡片风格。',c:'C：按地区归类，适合学生按地理顺序寻找学习内容。'}[variant];
 const url=new URL(location.href);url.searchParams.set('style',variant);history.replaceState(null,'',url);
 renderPreview?.();
}
document.querySelectorAll('[data-variant]').forEach(b=>b.addEventListener('click',()=>setVariant(b.dataset.variant)));
setVariant(variant);
preview.addEventListener('load',()=>{
 const doc=preview.contentDocument;
 const timer=setInterval(()=>{
  const map=doc.querySelector('#worldMapFrame');
  const win=map?.contentWindow,api=win?.__mapFilter;
  const toolbar=doc.querySelector('#mapToolbarHost');
  if(!api||!toolbar||doc.querySelector('#hostPeriod').options.length===0)return;
  clearInterval(timer);
  // Keep the comparison isolated after the B directory is integrated into the homepage.
  doc.querySelector('#hostStudyDirectory')?.remove();
  const css=doc.createElement('style');
  css.textContent=`
  .study-directory{grid-column:1/-1;min-width:0;border-top:1px solid var(--line);padding-top:10px}
  .study-directory summary{display:flex;align-items:center;gap:9px;min-height:44px;width:fit-content;padding:0 14px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:700;color:var(--ink);background:var(--card);cursor:pointer;list-style:none}
  .study-directory summary::-webkit-details-marker{display:none}
  .study-directory summary:focus-visible,.study-place:focus-visible{outline:2px solid #28708a;outline-offset:3px}
  .study-directory summary::after{content:'⌄';margin-left:7px}.study-directory[open] summary::after{content:'⌃'}
  .study-count{border-radius:999px;background:#f2e9d8;padding:3px 8px;font-size:11px;color:var(--ink-soft)}
  .study-directory-heading{display:flex;justify-content:space-between;gap:10px;margin:13px 0 9px;font-size:12px;color:var(--ink-soft);font-weight:600}
  .study-place-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-height:230px;overflow-y:auto;padding:2px}
  .study-place{display:flex;align-items:center;gap:10px;text-align:left;min-height:60px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;color:var(--ink);background:var(--card);font:inherit;cursor:pointer}
  .study-place:hover{border-color:#9b9382;background:#faf5ea}.study-place[aria-pressed=true]{border-color:#597f8b;background:#edf4f4}
  .study-pin-number{display:grid;place-items:center;flex:0 0 27px;height:27px;border-radius:50%;background:#6f9bc7;color:white;font-size:11px;font-weight:700}
  .study-place-copy{min-width:0;display:grid;gap:4px}.study-place-name{font-size:13px;font-weight:700;line-height:1.35}.study-place-meta{font-size:11.5px;font-weight:500;color:var(--ink-soft)}
  .study-directory[data-style=a] .study-place-list{display:flex;flex-wrap:wrap;gap:8px;max-height:150px}
  .study-directory[data-style=a] .study-place{min-height:44px;border-radius:999px;padding:6px 12px;gap:8px}
  .study-directory[data-style=a] .study-place-copy{display:flex;align-items:center;gap:9px}
  .study-directory[data-style=a] .study-place-meta{display:grid;place-items:center;min-width:22px;height:22px;border-radius:50%;background:#f2e9d8;font-weight:700}
  .study-directory[data-style=a] .study-pin-number{height:22px;flex-basis:22px;font-size:10px}
  .study-directory[data-style=c] .study-place-list{grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px;max-height:280px}
  .study-region{min-width:0;border-left:2px solid #d8c9a8;padding-left:10px}
  .study-region h3{margin:0 0 7px;font-size:12px;font-weight:800;color:#765738;line-height:1.4}
  .study-directory[data-style=c] .study-place{width:100%;border:0;border-radius:7px;min-height:48px;padding:6px;gap:8px;background:transparent}
  .study-directory[data-style=c] .study-place:hover,.study-directory[data-style=c] .study-place[aria-pressed=true]{background:#f2e9d8}
  .study-directory[data-style=c] .study-place-name{font-size:12.5px}.study-directory[data-style=c] .study-place-copy{gap:2px}
  @media(max-width:900px){.study-place-list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:450px){.study-place-list{grid-template-columns:1fr}.study-directory-heading{display:grid;gap:4px;line-height:1.6}}
  `;doc.head.append(css);
  const directory=doc.createElement('details');directory.className='study-directory';directory.open=true;
  directory.innerHTML='<summary>Study points <span class="study-count"></span></summary><div class="study-directory-heading"><span class="study-unit-label"></span><span>选择地点，直接打开学习内容</span></div><div class="study-place-list"></div>';
  toolbar.append(directory);
  const period=doc.querySelector('#hostPeriod');
  function render(){
   directory.dataset.style=variant;
   const unit=period.value||'u1';
   const data=win['APWH_'+unit.toUpperCase()+'_LOCATION_STUDY'];
   const list=directory.querySelector('.study-place-list');list.replaceChildren();
   const numbers=data?.locationNumbers||[];
   directory.querySelector('.study-count').textContent=numbers.length+' places';
   directory.querySelector('.study-unit-label').textContent='Unit '+unit.slice(1)+' · '+numbers.length+' places · '+(data?.records.length||0)+' study points'+(!period.value?'（预览默认 Unit 1）':'');
   const groups=new Map();
   const regionLabels={asia:'Asia',mideast:'Middle East & Central Asia',europe:'Europe',africa:'Africa',americas:'Americas'};
   for(const number of numbers){
    const records=data.getByLocation(number);if(!records.length)continue;
    const pin=[...win.document.querySelectorAll('.pin-group')].find(p=>p.querySelector('text')?.textContent.trim()===String(number));
    const region=pin?.dataset.region||'other';
    const button=doc.createElement('button');button.type='button';button.className='study-place';button.setAttribute('aria-pressed','false');
    const badge=doc.createElement('span');badge.className='study-pin-number';badge.textContent=number;
    const copy=doc.createElement('span');copy.className='study-place-copy';
    const name=doc.createElement('span');name.className='study-place-name';name.textContent=data.locationName(number);
    const meta=doc.createElement('span');meta.className='study-place-meta';meta.textContent=variant==='a'?records.length:records.length+' study points →';copy.append(name,meta);button.append(badge,copy);button.setAttribute('aria-label',data.locationName(number)+', '+records.length+' study points');
    button.addEventListener('click',()=>{
     doc.querySelector('.hdr-btn[data-learning-view="map"]')?.click();
     api.setLearningView('map');api.setQuery('');api.setPeriod(unit);period.value=unit;
     api.openEventInMap(String(number),pin?.dataset.region||'',records[0].mainEventKey);
     const opened=api.openLocationStudy(String(number));
     win.document.dispatchEvent(new win.MouseEvent('click',{bubbles:true}));
     list.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
     if(!opened)name.textContent=data.locationName(number)+' · 请点右侧学习入口';
    });
    if(variant==='c'){
     if(!groups.has(region)){const group=doc.createElement('section');group.className='study-region';const heading=doc.createElement('h3');heading.textContent=regionLabels[region]||'Other locations';group.append(heading);groups.set(region,group);list.append(group);}
     groups.get(region).append(button);
    }else list.append(button);
   }
  }
  renderPreview=render;
  period.addEventListener('change',render);
  doc.querySelector('[data-subj="world"]').click();
  doc.querySelector('.hdr-btn[data-learning-view="map"]')?.click();
  api.setLearningView('map');api.setPeriod('u1');period.value='u1';render();
  doc.querySelector('.map-card').scrollIntoView({block:'start'});
 },100);
});
</script>
</html>
