tisan fabrication; workshop unresolved)", "region": "europe", "coordinates": {"x": 0, "y": 0}, "traditionGroup": "Materials & Global Exchange", "workType": "Porcelain figurative sculpture", "provenanceQualifier": "MoMA identifies European artisan fabrication for the Banality series. A country or workshop for this edition is not established here; New York is an original 1988 exhibition context, not assumed fabrication.", "function": "将商业玩偶与明星形象提升为昂贵艺术对象，挑动高雅趣味和kitsch的边界。 The sculpture elevates celebrity imagery and toy-like forms into a luxury art object, provoking debate over the boundary between cultivated taste and kitsch.", "form": "光亮釉面、甜腻粉彩与放大的小摆件尺度形成精致却夸张的视觉效果。 Glossy glaze, sugary pastel colors and enlarged figurine scale produce a meticulously finished yet deliberately excessive object.", "content": "仿Jayne Mansfield的金发女郎抱着粉红豹，性感明星与儿童卡通消费形象混合。 A blonde pin-up modeled on Jayne Mansfield embraces the Pink Panther. Sexualized celebrity and cartoon consumption overlap in a deliberately artificial pairing.", "context": "属于1988年Banality系列，由欧洲工匠代制；现有证据未确定本件制作国家或工坊，纽约首展不能替代制作地点。 Part of the 1988 Banality series, the design was fabricated by European artisans. Evidence reviewed does not establish this edition's country or workshop; its New York exhibition context is not a fabrication location.", "recognitionAnchors": ["blonde pin-up 金发女郎", "pink cartoon panther 粉红卡通豹", "glossy pastel porcelain 光亮粉彩瓷"], "comparisonIds": ["ap250-sunflower-seeds"], "comparisonNotes": {"ap250-sunflower-seeds": "均由工匠制作瓷器并改变日常物件尺度；Koons将小摆件变为奢侈品，Ai以海量手工种子讨论个人与集体。 Both depend on artisan porcelain fabrication and altered everyday scale; Koons magnifies a figurine into luxury art, while Ai's vast field examines the individual and the collective."}, "keywords": ["kitsch 媚俗", "Banality 平庸系列", "fabrication 代制"], "images": [{"id": "complete-porcelain-sculpture", "label": "Complete porcelain figure holding Pink Panther / 抱粉红豹的完整瓷塑人物", "imageUrl": "study-media/complete/u10/ap230-complete-porcelain-sculpture.webp", "imageAlt": "Complete porcelain figure holding Pink Panther / 抱粉红豹的完整瓷塑人物", "imageSourceName": "学习图片 · AP Art History CED PDF p.295", "imageSourceUrl": "https://apcentral.collegeboard.org/media/pdf/ap-art-history-course-and-exam-description.pdf#page=295"}]}, {"id": "ap250-sunflower-seeds", "apNumber": 250, "unit": 10, "titleEn": "Kui Hua Zi (Sunflower Seeds)", "titleZh": "葵花籽", "artistCulture": "Ai Weiwei", "culture": "Chinese contemporary conceptual art; Jingdezhen porcelain and global labor", "date": "2010–2011 C.E.", "period": "Global Contemporary, 1980 C.E. to present", "medium": "Sculpted and painted porcelain", "siteName": "Turbine Hall, Tate Modern, London, United Kingdom", "region": "united-kingdom", "coordinates": {"x": 800, "y": 171}, "traditionGroup": "Materials & Global Exchange", "workType": "Porcelain seed-field installation", "provenanceQualifier": "The required 2010-2011 installation is anchored to its original London presentation. Porcelain seeds were made and painted in Jingdezhen, China; this production geography must remain visible rather than being replaced by the presentation anchor.", "function": "借海量手工瓷籽质疑大量生产、个人与集体及全球消费劳动关系。 A vast field of handmade porcelain seeds questions mass production, relations between individual and collective, and the labor behind global consumption.", "form": "逼真的灰白黑瓷籽铺满Turbine Hall地面，远观统一，近看笔绘差别；必看为原始种子场。 Realistic gray-white-black porcelain husks cover the Turbine Hall floor. Distant uniformity gives way to hand-painted differences close up; the required view is the original seed field.", "content": "葵花联系Mao为太阳的宣传和分享零食的记忆；材料不是可食用真实种子。 Sunflowers evoke propaganda representing Mao as the sun and memories of shared snacks. The objects are porcelain, not edible actual seeds.", "context": "London是2010–2011原始展示，Jingdezhen是手工塑绘生产；初期可走入后因瓷尘限制接触，不能称全展始终互动。 London is the original 2010–2011 presentation site and Jingdezhen the fabrication context. Early walk-in interaction was restricted because of porcelain dust, so unrestricted participation did not persist throughout the exhibition.", "recognitionAnchors": ["vast gray seed field 大片灰色种子", "Turbine Hall industrial space 工业大厅", "hand-painted porcelain husks 手绘瓷壳"], "comparisonIds": ["ap245-old-mans-cloth"], "comparisonNotes": {"ap245-old-mans-cloth": "都由大量小单元与协作劳动成大作品；Ai铺地瓷籽，Anatsui将消费废金属悬挂并改变褶皱。 Both assemble small units through collaborative labor; Ai spreads porcelain seeds on the floor, while Anatsui suspends consumer metal refuse in changeable folds."}, "keywords": ["porcelain 瓷", "collective labor 集体劳动", "individuality 个体性"], "images": [{"id": "turbine-hall-seed-field", "label": "Low view across seed field inside Turbine Hall / 涡轮大厅内低视角葵花籽地面", "imageUrl": "study-media/complete/u10/ap250-turbine-hall-seed-field.webp", "imageAlt": "Low view across seed field inside Turbine Hall / 涡轮大厅内低视角葵花籽地面", "imageSourceName": "学习图片 · AP Art History CED PDF p.301", "imageSourceUrl": "https://apcentral.collegeboard.org/media/pdf/ap-art-history-course-and-exam-description.pdf#page=301"}]}], "credits": {"ap224-gates": [{"creatorOrInstitution": "Christo and Jeanne-Claude; Photo © Chip East/Reuters/Corbis", "licenseName": "Study copy; existing source and photographer attribution retained. No new open-license claim.", "licenseUrl": "https://apcentral.collegeboard.org/media/pdf/ap-art-history-course-and-exam-description.pdf#page=293"}, {"creatorOrInstitution": "Christo and Jeanne-Claude; Photo © Panoramic Images/Getty Images", "licenseName": "Study copy; existing source and photographer attribution retained. No new open-license claim.", "licenseUrl": "https://apcentral.collegeboard.org/media/pdf/ap-art-history-course-and-exam-description.pdf#page=293"}], "ap225-vietnam-veterans-memorial": [{"creatorOrInstitution": "Maya Lin; Photo © James P. Blair/Corbis", "licenseName": "Study copy; existing source and photographer attribution retained. No new open-license claim.", "licenseUrl": "https://apcentral.collegeboard.org/media/pdf/ap-art-history-course-and-exam-description.pdf#page=293"}, {"creatorOrInstitution": "Maya Lin; Photo © Ian Dagnall/Alamy", "licenseName": "Study copy; existing source and photographer attribution retained. No new open-license claim.", "licenseUrl": "https://apcentral.collegeboard.org/media/pdf/ap-art-history-course-and-exam-description.pdf#page=293"}], "ap230-pink-panther": {"creatorOrInstitution": "Jeff Koons; Permission of artist; © The Museum of Modern Art/SCALA/Art Resource", "licenseName": "Study copy; existing source and photographer attribution retained. No new open-license claim.", "licenseUrl": "https://apcentral.collegeboard.org/media/pdf/ap-art-history-course-and-exam-description.pdf#page=295"}, "ap250-sunflower-seeds": {"creatorOrInstitution": "Ai Weiwei; © Oliver Strewe/Getty Images", "licenseName": "Study copy; existing source and photographer attribution retained. No new open-license claim.", "licenseUrl": "https://apcentral.collegeboard.org/media/pdf/ap-art-history-course-and-exam-description.pdf#page=301"}}}</script>
<script>
const data=JSON.parse(document.getElementById('prototype-data').textContent);
const pairs=[['ap230-pink-panther','ap250-sunflower-seeds'],['ap224-gates','ap225-vietnam-veterans-memorial']];
const prototypeParams=new URLSearchParams(location.search);
const integrated=prototypeParams.get('integrated')==='1';
const state={pair:prototypeParams.get('pair')==='1'?1:0,swapped:false,tab:'focus',views:{}};
if(integrated){document.body.classList.add('integrated');document.querySelector('.top').hidden=true;document.querySelector('.tools').hidden=true;document.querySelector('.footer').hidden=true;}
document.getElementById('pairSelect').value=String(state.pair);
const $=id=>document.getElementById(id);const work=id=>data.works.find(w=>w.id===id);
const text=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e};
const imageUrl=path=>'../'+path;
function bilingual(value){const match=value.match(/^([\s\S]*?[。])\s+([A-Z][\s\S]*)$/);return match?[match[1],match[2]]:[value,''];}
function addReading(host,value){const [cn,en]=bilingual(value);host.append(text('p',cn));if(en){const d=document.createElement('details');d.className='reading-english';d.append(text('summary','English'),text('p',en));host.append(d);}}
function ordered(){const ids=[...pairs[state.pair]];if(state.swapped)ids.reverse();return ids.map(work);}
function showImage(w,index,trigger){const media=w.images[index];$('imageTitle').textContent=w.titleZh+' · '+w.titleEn;$('largeImage').src=imageUrl(media.imageUrl);$('largeImage').alt=media.imageAlt;$('largeCaption').textContent=media.label+' · '+(Array.isArray(data.credits[w.id])?data.credits[w.id][index]:data.credits[w.id]).creatorOrInstitution;$('imageDialog').showModal();$('closeImage').focus();$('imageDialog').onclose=()=>trigger.focus();}
function renderArt(w,side){const index=state.views[w.id]||0;const media=w.images[index];const card=text('article','','art');card.setAttribute('aria-label',w.titleZh+'作品图像');const label=text('div','','art-label');label.append(text('span',side===0?'A':'B','letter'),text('span','AP '+w.apNumber+' · '+(w.id===pairs[state.pair][0]?'原作品':'对比作品')));const title=text('h2',w.titleZh);title.append(text('span',w.titleEn,'english-title'));card.append(label,title,text('p',w.artistCulture+' · '+w.date,'metadata'));
const open=text('button','','image-open');open.type='button';open.setAttribute('aria-label','查看'+w.titleZh+'大图');const img=document.createElement('img');img.src=imageUrl(media.imageUrl);img.alt=media.imageAlt;open.append(img,text('span','查看大图 ↗','zoom-tag'));open.onclick=()=>showImage(w,index,open);card.append(open);
const views=text('div','','image-switch');if(w.images.length>1)w.images.forEach((m,i)=>{const b=text('button',(i+1)+' · '+(m.label.split(' / ')[1]||m.label));b.setAttribute('aria-pressed',String(index===i));b.onclick=()=>{state.views[w.id]=i;renderGallery();const art=$('artGrid').children[side];art.querySelectorAll('.image-switch button')[i].focus({preventScroll:true})};views.append(b)});else views.append(text('span','完整作品视图','single-view'));card.append(views);
const credit=Array.isArray(data.credits[w.id])?data.credits[w.id][index]:data.credits[w.id];const source=document.createElement('details');source.className='credit';source.append(text('summary','图片出处与署名'));source.append(text('p',credit.creatorOrInstitution));const link=text('a',media.imageSourceName);link.href=media.imageSourceUrl;link.target='_blank';link.rel='noopener noreferrer';source.append(link,text('p',credit.licenseName));card.append(source);return card;}
function renderGallery(){$('artGrid').replaceChildren(...ordered().map(renderArt));}
function renderReading(){document.querySelectorAll('[role=tab]').forEach(b=>{const active=b.dataset.tab===state.tab;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1});const panel=$('readingPanel');panel.setAttribute('aria-labelledby','tab-'+state.tab);panel.replaceChildren();const [a,b]=ordered();if(state.tab==='focus'){const note=text('div','','note');note.append(text('h3','为什么比较这两件作品'));const source=work(pairs[state.pair][0]);const value=source.comparisonNotes[pairs[state.pair][1]];addReading(note,value);panel.append(note);}else{const grid=text('div','','study-grid');[a,b].forEach((w,i)=>{const article=document.createElement('article');article.append(text('h3',(i===0?'A · ':'B · ')+w.titleZh));addReading(article,w[state.tab]);grid.append(article)});panel.append(grid);}}
function render(){renderGallery();renderReading();$('backLabel').textContent='返回「'+work(pairs[state.pair][0]).titleZh+'」';}
document.querySelectorAll('[role=tab]').forEach(b=>{b.onclick=()=>{state.tab=b.dataset.tab;renderReading()};b.onkeydown=e=>{const tabs=[...document.querySelectorAll('[role=tab]')];let n=tabs.indexOf(b);if(e.key==='ArrowRight')n=(n+1)%tabs.length;else if(e.key==='ArrowLeft')n=(n+tabs.length-1)%tabs.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=tabs.length-1;else return;e.preventDefault();tabs[n].click();tabs[n].focus()}});
$('pairSelect').onchange=e=>{state.pair=Number(e.target.value);state.swapped=false;state.views={};render()};$('swapButton').onclick=()=>{state.swapped=!state.swapped;render()};$('closeImage').onclick=()=>$('imageDialog').close();$('imageDialog').onclick=e=>{if(e.target===$('imageDialog')&&e.clientX<$('imageDialog').getBoundingClientRect().left)$('imageDialog').close()};
$('backButton').onclick=()=>{if(integrated&&parent!==window){parent.postMessage({namespace:'art-comparison-prototype',type:'close'},location.origin);return;}const w=work(pairs[state.pair][0]);$('comparisonScreen').hidden=true;$('lessonScreen').hidden=false;const lesson=$('lessonScreen');lesson.replaceChildren();lesson.append(text('div','AP ART HISTORY · UNIT '+w.unit,'eyebrow'));const grid=text('div','','lesson-grid');const img=document.createElement('img');img.src=imageUrl(w.images[0].imageUrl);img.alt=w.images[0].imageAlt;const body=document.createElement('div');const title=text('h1',w.titleZh);title.id='lessonTitle';title.tabIndex=-1;body.append(title,text('p',w.titleEn));const chips=text('div','','context-chips');chips.append(text('span','AP '+w.apNumber),text('span',w.artistCulture));body.append(chips);addReading(body,w.function);const button=text('button','继续比较学习 →','primary');button.id='resumeCompare';button.onclick=()=>{$('lessonScreen').hidden=true;$('comparisonScreen').hidden=false;$('tab-'+state.tab).focus({preventScroll:true})};body.append(button);grid.append(img,body);lesson.append(grid);title.focus({preventScroll:true});window.scrollTo(0,0)};
render();
</script></body></html>
